<div id="nr-body">
  <p>On November 25 the Trump administration proposed new tariffs on 14 trading partners that it says subsidize factories and flood world markets with cheap goods. Under Section 301 of the Trade Act of 1974, U.S. Trade Representative Jamieson Greer proposed up to 20% on Chinese goods, on top of existing tariffs, rising to 40% if a trade truce that expires January 10 breaks down; 15% on the European Union; and up to 15% to 35% on Japan, South Korea, India, Vietnam and eight others. A separate proposal targets Brazilian sugar and aircraft. Nothing takes effect yet: comments are due January 5 and hearings begin January 25. Greer said trading partners knew what was coming and “a lot of this is baked in.”</p>
  <p>The plan largely rebuilds tariffs the Supreme Court struck down on February 20, when it ruled 6-3 that the emergency-powers law does not authorize the president to impose them. Goldman Sachs estimated it would lift the overall U.S. tariff rate from 7.8% to 9.2%, with a very small effect on inflation. Importers are being refunded roughly $166 billion paid under the struck-down tariffs; consumers who paid higher prices have no direct claim. Democrats, who take control of Congress in January, criticized the plan, as have some Republicans, and about two-thirds of midterm voters said the tariffs had hurt the economy. China called “overcapacity” a false issue, and Brazil threatened to retaliate.</p>
  <p><strong>Why it matters:</strong> The administration is rebuilding its tariffs on a different legal footing, weeks after voters who blamed tariffs for higher prices gave Democrats control of Congress. Whether the new rates survive the hearings, the courts and the new Congress will shape what Americans pay for imported goods next year.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Section 301 is the law Trump used for his first-term tariffs on Chinese goods in 2018 and 2019, and President Biden used it in May 2024 to raise tariffs on Chinese electric vehicles, chips, solar cells and batteries. Unlike the emergency-powers tariffs, it requires a country-by-country investigation, a public comment period and hearings, which makes it slower but harder to challenge in court. Since the Supreme Court’s February ruling, the administration has relied on it and on Section 232 national-security tariffs, while importers seek refunds of the struck-down duties.</p>
</div>
<!-- END: historical-context -->

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.reuters.com/world/us/us-proposes-new-tariffs-14-trading-partners-fight-excess-factory-capacity-2026-11-25/">Reuters</a>: Reports the 14 targets and that China faces the highest rates, citing a senior official throughout: 20% on top of first-term tariffs, within the caps in existing trade deals (15% for the EU, Japan, South Korea and Taiwan, 19% for Malaysia). In its own voice it says the plan is “widely viewed as rebuilding” the tariffs the Supreme Court struck down, and that the administration’s tariffs “have in part contributed to higher prices,” citing a Reuters/Ipsos poll in which 62% backed repeal. It notes that China rejects the accusations. It quotes no member of Congress or other U.S. critic and gives no estimate of the economic impact.</li>
    <li><a href="https://apnews.com/article/trump-tariffs-china-european-union-367083ea32f71fd7f70029ba7df66bf0">AP</a>: The most complete account. Gives the rates (15% to 35%, covering about three-fifths of U.S. imports), the exemptions, the January 25 hearing, and that the tariffs would also replace revenue lost after the Supreme Court ruling. Quotes Greer (“a lot of this is baked in”), Sen. Ron Wyden (D) (“another blatant attempt … to reconstruct his illegal global tariffs”), a small-business group, Brazil and China. Cites Goldman Sachs (the overall rate rising from 7.8% to 9.2%, with “a very small incremental impact” on inflation) and an AEI scholar who called the plan too weak. In its own voice it says voters “punished Republicans” in the midterms. No Republican lawmaker is quoted.</li>
    <li><a href="https://www.foxbusiness.com/fox-news-global-economy/trump-admin-raise-tariffs-china-eu-other-trading-partners">Fox</a>: Fox’s main article ran on Fox Business. It explains the overcapacity rationale, China’s rate and trade truce, the caps in existing deals, the countries covered, the separate Brazil action (quoting Greer) and China’s rejection, and says the plan aims to “rebuild tariffs that the Supreme Court struck down.” It quotes no member of Congress or other U.S. critic, gives no estimate of costs to consumers or of the economic impact, and does not mention the midterm results.</li>
    <li><a href="https://nypost.com/2026/11/25/business/us-proposes-new-tariffs-on-14-trading-partners-including-china-japan-eu-and-india/">New York Post</a>: A short report: the 14 targets, China’s 20% (40% if the truce fails), other rates mostly 10% to 18%, and Greer’s statement. It calls the plan Trump’s “biggest push yet to put his tariffs back on solid legal ground” after the Supreme Court ruling, and notes that many economists blamed last year’s tariffs in part for persistent inflation. It quotes no critic, gives no timeline or reaction from trading partners, and garbles the law’s name as “the 1973 Trade Act of 1974.”</li>
    <li><a href="https://www.washingtonexaminer.com/news/white-house/4814966/new-trump-administration-tariffs-china-eu/">Washington Examiner</a>: Reports the 14 targets, China’s rate and truce, the caps in trade deals, Greer’s statement and China’s rejection. In its own voice it says the plan escalates “a global trade war,” that Greer “claimed” the tariffs would level the playing field, and that “tariff fallout that raised the cost of living helped Democrats flip both chambers of Congress.” It quotes no member of Congress and gives no estimate of the economic impact or hearing dates.</li>
    <li><a href="https://abcnews.com/Politics/trump-admin-proposes-new-tariffs-china-eu-12/story?id=138442698">ABC News</a>: Calls the plan “the latest escalation in global trade tensions,” notes Trump’s court defeats and midterm losses, and explains the finding, China’s 20% rate, the comment period and the Brazil action. It quotes Greer at length, China, and Democrats Ron Wyden and Chuck Schumer (“passing the costs onto American families”). It gives no rates for the other 13 economies, no estimate of the economic impact, and no Republican critic.</li>
    <li><a href="https://www.cnn.com/2026/11/25/economy/trump-new-tariffs">CNN</a>: Gives the rates for China, Vietnam and the EU, the exclusions and the January timeline, and explains the administration’s case. In its own voice it says Americans are “unlikely to see prices rise substantially” and that the push is “unlikely to score well with voters and some Republican lawmakers,” citing its exit poll and quoting Sen. Todd Young (R). It adds an aside on Nvidia’s Jensen Huang. It quotes no Democrat or trading partner. It calls 20% the highest proposed rate, though the notices propose up to 25% for India and 35% for Vietnam.</li>
    <li><a href="https://www.ms.now/news/trump-proposes-new-tariffs-on-china-eu-other-u-s-trading-partners">MSNOW</a>: Calls the plan “the latest escalation in President Donald Trump’s global trade war,” and its subheadline says the tariffs “are likely to face an uphill battle in the courts and the new Democratic-controlled Congress.” Gives China’s rate, the truce, the countries, the Brazil action, Greer’s comments and the administration’s case, then says research found last year’s tariffs contributed to inflation, citing a New York Fed study. Quotes Rep. Don Bacon (R) and Sen. Chuck Schumer (D). It says the Supreme Court ruled the earlier tariffs “unconstitutional”; the court ruled that the emergency-powers law does not authorize them.</li>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> “I think a lot of this is baked in.”</p>
  <p><strong>Origin:</strong> U.S. Trade Representative Jamieson Greer, CNBC interview, November 25, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Goldman Sachs estimated the plan would return most tariffs on the affected countries to where they were before the Supreme Court ruling, lifting the overall rate from 7.8% to 9.2% with a very small effect on inflation. A Capital Economics economist said the duties “were widely expected” and “would return us roughly to where we were earlier in the year.”</p>

  <p><strong>Claim:</strong> The plan is “another blatant attempt by Donald Trump to reconstruct his illegal global tariffs.”</p>
  <p><strong>Origin:</strong> Sen. Ron Wyden (D), statement, November 25, 2026, as quoted by AP and ABC News.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The earlier tariffs were unlawful, since the Supreme Court ruled the emergency-powers law did not authorize them, and economists say the new rates would largely restore them. But the new tariffs are being proposed under Section 301, a different law that requires country-by-country investigations, comments and hearings and that no court has ruled against; tying them to “illegal” tariffs suggests they are unlawful too. “Blatant” is Wyden’s opinion.</p>

  <p><strong>Claim:</strong> Trump is “passing the costs onto American families.”</p>
  <p><strong>Origin:</strong> Senate Democratic leader Chuck Schumer, social media post, November 25, 2026, as quoted by ABC News.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> A New York Fed staff report found last year’s tariffs raised the prices of everyday goods, adding 2.9 percentage points to goods inflation by February 2026. The new proposal is not in effect, and Goldman Sachs expects it to add little to inflation because it mostly restores earlier rates, so the costs would continue rather than grow.</p>

</div>

  window.DATA.mirror = {"pair": {"story": "The Biden administration’s Section 301 tariff increases on $18 billion of Chinese imports, including 100% on electric vehicles and higher rates on chips, solar cells, batteries, steel and aluminum", "date": "May 14, 2024", "differs": "Both are Section 301 actions by a sitting president’s trade office, framed around subsidized overproduction, with questions about costs to consumers. Biden’s targeted only China and about $18 billion in imports, and was final when announced; Trump’s covers 14 economies including allies, could reach about three-fifths of U.S. imports, is only proposed, and follows a Supreme Court ruling against his earlier tariffs."}, "outlets": [{"outlet": "Reuters", "class": "reuters", "side": "r", "scrutiny_r": 2, "scrutiny_d": 3, "lean_r": 1, "lean_d": 0, "result": "Consistent", "explain": "Both times it reported the action through officials and added its own context on politics and prices: in 2024 that Biden acted “in a bid to woo voters” and that analysts warned EV costs could rise, and in 2026 that past tariffs contributed to higher prices and most poll respondents backed repeal. In 2026 it quoted no U.S. critic; in 2024 it quoted none either beyond unnamed analysts.", "evidence": ["in a bid to woo voters who rate his economic policies poorly", "have in part contributed to higher prices on consumer goods"]}, {"outlet": "AP", "class": "ap", "side": "r", "scrutiny_r": 4, "scrutiny_d": 3, "lean_r": -1, "lean_d": 0, "result": "Consistent", "explain": "Both times it quoted the president’s opponents, cited an outside estimate of the inflation effect, and used punchy verbs in its own voice: Biden “slapped” tariffs and “snipes at Trump” in 2024, and voters “punished Republicans” in 2026.", "evidence": ["snipes at Trump", "even after voters in this month’s midterm elections punished Republicans"]}, {"outlet": "Fox", "class": "fox", "side": "r", "scrutiny_r": 1, "scrutiny_d": 3, "lean_r": 1, "lean_d": 0, "result": "Consistent", "explain": "In 2024 it quoted the Trump campaign’s attack on Biden’s tariffs and Biden’s own 2019 criticism of Trump’s tariffs. In 2026 it quoted no domestic critic and gave no costs. It was tougher on the Democratic president, but the difference is within the margin.", "evidence": ["Crooked Joe's agenda", "rebuild tariffs that the Supreme Court struck down in February"]}, {"outlet": "New York Post", "class": "nypost", "side": "r", "scrutiny_r": 2, "scrutiny_d": 4, "lean_r": 1, "lean_d": 2, "result": "Uneven: tougher on Democrats", "explain": "In 2024 it wrote that “the 81-year-old Biden claimed,” quoted a Democratic governor against the tariffs, recalled Biden’s 2019 criticism of Trump’s tariffs and closed with allegations about the Biden family’s China ties. In 2026 it quoted only Greer and gave only a brief note on inflation. Its wording favored the Republican side in both stories, and it pressed the Democratic president harder.", "evidence": ["the 81-year-old Biden claimed", "Trump’s biggest push yet to put his tariffs back on solid legal ground"]}, {"outlet": "Washington Examiner", "class": "examiner", "side": "r", "scrutiny_r": 2, "scrutiny_d": null, "lean_r": -1, "lean_d": null, "result": "Not enough evidence", "note": "Its May 14, 2024 article (“Biden boosts union workers and hits Trump with China tariffs rollout”) is behind a subscription wall, and only its opening could be read."}, {"outlet": "ABC News", "class": "abc", "side": "r", "scrutiny_r": 3, "scrutiny_d": 3, "lean_r": 0, "lean_d": 0, "result": "Consistent", "explain": "Both times it quoted the president’s chief opponents (Trump in 2024; Wyden and Schumer in 2026) and noted the political stakes: the election-year timing in 2024, and the Republicans’ midterm losses in 2026.", "evidence": ["looks to project himself as tougher on China", "the latest escalation in global trade tensions"]}, {"outlet": "CNN", "class": "cnn", "side": "r", "scrutiny_r": 3, "scrutiny_d": 2, "lean_r": 0, "lean_ function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D,plain){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band=(plain?'':'Severity '+sev+': ')+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?(i===P.length-1?'Current — ':'Earlier — ')+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}

 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}

 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}

 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('🤔 Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);if(J.shifts&&J.shifts.length){const w=E('div');J.shifts.forEach((S,i)=>{w.append(E('h3','',esc(S.focus_actor||'')));w.append(drift(S,true));if(S.note)w.append(E('p','',esc(S.note)));if(S.sources&&S.sources.length)w.append(E('p','',' <small>Sources: '+S.sources.map(esc).join('; ')+'</small>'))});out.append(card('Narrative Drift',w))}else out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));
 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
