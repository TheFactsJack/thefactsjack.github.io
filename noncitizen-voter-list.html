<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>On October 13, the Justice Department gave California election officials a list of more than 20,000 registered voters it describes as “likely noncitizens” who were sent mail ballots, and asked that their ballots be set aside until their citizenship is confirmed. The department says the list came from “internal immigration records” and data matching. When the state declined, saying it had been given no evidence, the department sued on October 15 and warned officials that counting those ballots could make them liable as abettors. President Trump wrote that the officials “will all go to jail for a long period of time.”</p>
  <p>On October 19, the department charged 28 lawful permanent residents on the list with crimes including false statements and fraudulent voter registration; it says 23 of them voted. “Every illegal vote cancels out the vote of a lawful American citizen,” Acting Deputy Attorney General Trent McCotter said, adding that “there may be some names on there who it turns out ultimately are citizens.”</p>
  <p>On October 20, Los Angeles County told the court that in a sample of 200 records, 112 were canceled or inactive registrations and 38.9% of those with a recorded birthplace were born in the United States, “strong evidence of citizenship.” A federal prosecutor called the figures “meaningless” and said all 20,000 are noncitizens; the department has asked an appeals court to act before a hearing set for October 27. Studies have found noncitizen voting to be rare, and a similar federal claim in Nevada shrank from 15,903 names to 185.</p>
  <p><strong>Why it matters:</strong> The dispute decides whether thousands of mail ballots are counted in an election 12 days away. Errors either way carry a cost: noncitizen votes are illegal, and setting aside citizens’ ballots would disenfranchise eligible voters.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>The Justice Department has sued 30 states and the District of Columbia this year for voter-roll data, so far without success, and on October 21 a federal judge limited Homeland Security checks for noncitizen voters in nine states, California among them, citing flawed data. In Nevada this summer, a federal claim of 15,903 possible noncitizen voters fell to 185 after manual review, and the state says all 185 appear to be citizens. Earlier studies found noncitizen voting rare: about 30 suspected cases among 23.5 million votes in 2016 (Brennan Center) and 20 noncitizens among 8.2 million registrants in Georgia’s 2024 audit. California is so far the only state the department has sued to set aside ballots.</p>
</div>

<div id="fc-claims">

  <p><strong>Claim:</strong> All 20,000 people on the list are noncitizens (“We believe it’s at a minimum of 20,000. That’s the floor”).</p>
  <p><strong>Origin:</strong> First Assistant U.S. Attorney Bill Essayli, who wrote on X on October 16 that the names were “confirmed” and told Fox News Digital on October 22 that all 20,000 were checked; the Department of Homeland Security said it had “manually verified” them.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The department’s own lawsuit and emergency motion call the names only “likely” or “highly likely” noncitizens, and its acting deputy attorney general said some may turn out to be citizens. Los Angeles County’s sample found most records canceled or inactive and many U.S.-born registrants, a similar federal list in Nevada shrank from 15,903 names to 185, and on October 21 a federal judge found that Homeland Security’s noncitizen-voter checks in nine states rested on “admittedly flawed and incomplete data.”</p>

  <p><strong>Claim:</strong> Twenty-eight people on the list are noncitizens who illegally registered, and most of them voted.</p>
  <p><strong>Origin:</strong> Justice Department, October 19, 2026.</p>
  <p><strong>Verdict:</strong> ⚖️ Alleged</p>
  <p><em>Rationale:</em> The department filed criminal complaints naming each defendant, all lawful permanent residents, and says 23 voted in elections from 2020 to 2026. These are charges, not convictions, and none has been tried.</p>

  <p><strong>Claim:</strong> Audits, recounts and court cases have found no evidence of widespread voter fraud.</p>
  <p><strong>Origin:</strong> California Attorney General Rob Bonta, interview with MS NOW, October 18, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Studies have found noncitizen voting rare, for example about 30 suspected cases among 23.5 million votes in 2016 and 20 noncitizens among 8.2 million Georgia registrants in 2024. Individual cases do occur, as the department’s 28 charges and its count of 113 people charged in 20 states show, but nothing found approaches widespread fraud.</p>

  <p><strong>Claim:</strong> In Nevada, the federal government alleged nearly 16,000 noncitizens on the rolls, and the state found that all were citizens.</p>
  <p><strong>Origin:</strong> California Secretary of State Shirley Weber, as reported by AP, October 15, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The federal claim did shrink sharply, from 15,903 names to 6,218 high-confidence matches and then to 185 after manual review, according to CNN’s account. Nevada says those 185 appear to be citizens, but the state did not check all 16,000 names individually.</p>

</div>

$('#smpm').onclick=()=>{$('#src').value='';render(SAMPLE_MED)};
$('#smpa').onclick=()=>{$('#src').value='';render(SAMPLE_ADS)};
$('#smpk').onclick=()=>{$('#src').value='';render(SAMPLE_PIKE)};
$('#smp2').onclick=()=>{$('#src').value='';render(SAMPLE_OLD)};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#src').value=r.result;render(r.result)};r.readAsText(f)};
render(SAMPLE_NONCIT);
if(/(^|[#?&])load\b/.test(location.hash+location.search)){const L=$('#loader');L.hidden=false}
</script>
</body>
</html>
