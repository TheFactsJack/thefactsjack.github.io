<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>On Wednesday, October 28, U.S. District Judge David O. Carter in Los Angeles denied the Justice Department’s request for an emergency order barring California from counting mail ballots from more than 20,000 registered voters the department says are likely noncitizens. Setting the ballots aside, he wrote, “would wreak havoc and disrupt the election that is already underway, create a chilling effect on election workers and voters alike, and discount the votes of United States citizens.”</p>
  <p>Carter wrote that states control their own elections and that the department never explained how counting ballots would hamper prosecutions, noting that it had already charged 28 people on its list. “If the Executive can discount votes and threaten an ongoing election due to unproven allegations, then our democracy is in danger,” he wrote. The department appealed to the Ninth Circuit that evening. First Assistant U.S. Attorney Bill Essayli said the list came from comparing voter rolls with “USCIS immigration, Social Security, and passport records” and that “This ongoing emergency disenfranchises American citizens through dilution.”</p>
  <p>California says the department’s claims rest on “suspect data” and that setting ballots aside would disenfranchise eligible voters. Local officials’ early review found many listed names were not on the rolls or were inactive, and some appeared to be U.S.-born; federal officials disputed that in sworn declarations. The department has not said how many of the 20,000 returned a ballot.</p>
  <p><strong>Why it matters:</strong> More than 3.7 million Californians had voted when Carter ruled, six days before the November 3 election. The appeal will test how far the federal government can go in challenging a state’s count while voting is underway.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>The department gave California its list on October 13, sued on October 15 to have the ballots set aside, and on October 19 charged 28 lawful permanent residents on the list, 23 of whom it says voted. On October 26 a divided Ninth Circuit panel dismissed its first emergency appeal because Carter had not yet ruled. The department has since asked Washington state to set aside ballots from 400 voters. Studies have found noncitizen voting rare: about 30 suspected cases among 23.5 million votes in 2016 (Brennan Center) and 20 noncitizens among 8.2 million registrants in Georgia’s 2024 audit.</p>
</div>
<!-- END: historical-context -->

<!-- BEGIN: outlet-coverage -->
<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.foxnews.com/politics/judge-rejects-doj-request-block-california-immediately-counting-ballots-linked-alleged-noncitizens">Fox</a>: Published the morning after the ruling, it quotes Carter’s “wreak havoc” and “unproven allegations” passages, reports the department’s immediate appeal and gives Bill Essayli’s two posts at length, including his account of how the list was matched. California’s side appears only as its view that the claims relied on “suspect data” and a paraphrase of Los Angeles County. It reports Trump’s view that noncitizen voting is widespread without the studies that find it rare, and its lead and embedded videos feature the prosecutor.</li>
    <li><a href="https://www.washingtonexaminer.com/news/justice/4783689/judge-denies-doj-effort-isolate-california-mail-ballots/">Washington Examiner</a>: Leads with the denial “less than a week before the midterm elections,” quotes Carter on state sovereignty and his advice from the bench to “Go out and indict,” and gives Essayli’s appeal statement and the department’s argument for checking ballots before they are counted. California’s and Los Angeles County’s objections are paraphrased, not quoted. It adds the Ninth Circuit’s split dismissal of the first appeal, but not local officials’ findings about the list, the 28 charges or how rare noncitizen voting is.</li>
    <li><a href="https://www.reuters.com/world/us-justice-dept-loses-initial-bid-block-votes-alleged-noncitizens-california-2026-10-29/">Reuters</a>: Calls the ruling a strong rebuke, quotes Carter’s opening line that “Never before in American history” had the federal government tried such a thing on the eve of an election, and gives Essayli’s statement and California’s view that the claims rely on “suspect data.” It notes that the department has not said how many of the 20,000 returned a ballot, says studies and audits find noncitizen voting rare, and covers the similar actions in Washington and Alaska. In its own voice it says the lawsuit “signaled the Trump administration’s willingness to contest the midterm results in court.”</li>
    <li><a href="https://apnews.com/article/california-noncitizen-voting-trump-midterm-lawsuit-481bed64919ad193e80e051d28beb2c0">AP</a>: Explains Carter’s reasoning most fully: setting ballots aside would work like a purge of the voter rolls within 90 days of an election, and the department’s 28 arrests show it can already enforce the law. It quotes Essayli twice, notes the Ninth Circuit’s dismissal and the Washington and Alaska actions, and closes with two outside voices who praise the ruling, one from the group representing Los Angeles County, which it identifies. It calls the 90-day law the “National Voting Rights Act”; the law is the National Voter Registration Act.</li>
    <li><a href="https://www.cnn.com/2026/10/28/politics/judge-denies-trump-bid-california-ballots">CNN</a>: Reports Carter’s reasoning and the department’s appeal, then spends its second half on how the list was built: methods kept secret, a thumb drive with a handwritten password, a 48-hour deadline and an earlier Homeland Security claim of 190,000. It reports local officials’ findings that many names are not on the rolls or appear U.S.-born, with Homeland Security’s dispute. It quotes no one from the department, gives no figures on how rare noncitizen voting is, and in its own voice calls the matches “supposedly” high confidence.</li>
    <li><a href="https://www.ms.now/news/federal-judge-denies-doj-demand-california-mail-ballots">MSNOW</a>: Stresses Carter’s view that the request was unprecedented, reports the appeal with one Essayli quote, and explains his finding that the department’s 28 prosecutions show California was not blocking enforcement. It reports the judge’s doubts about a Homeland Security database “enhanced” with commercial data and closes with Attorney General Rob Bonta’s statement. It does not say how rare noncitizen voting is.</li>
  </ul>
</div>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Ballots from 20,000 suspected noncitizens are being processed, and “This ongoing emergency disenfranchises American citizens through dilution.”</p>
  <p><strong>Origin:</strong> First Assistant U.S. Attorney Bill Essayli, October 28, 2026, as quoted by AP, Reuters and MSNOW.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The department’s own filings call the names only “likely” noncitizens, and it has not said how many of the 20,000 returned a ballot. Judge Carter called the allegations “unproven,” and local officials’ early review found many listed names were not on the rolls or were inactive. Some people on the list have been charged: 28, of whom the department says 23 voted.</p>

  <p><strong>Claim:</strong> “There are no mysterious databases… Voter rolls were compared to USCIS immigration, Social Security, and passport records.”</p>
  <p><strong>Origin:</strong> Bill Essayli on X, October 28, 2026, as quoted by Fox News.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Those government records were used, but a Homeland Security official’s sworn declaration says the database was “enhanced” with commercial data sources, according to MSNOW’s account of the ruling, and CNN reports that the department started from a purchased voter list and has kept key details of its method secret. Naming only government records leaves that out.</p>

  <p><strong>Claim:</strong> Noncitizen voting is widespread.</p>
  <p><strong>Origin:</strong> President Trump, as reported by Fox News and Reuters on October 28 and 29, 2026.</p>
  <p><strong>Verdict:</strong> ❌ False</p>
  <p><em>Rationale:</em> Studies and audits have found noncitizen voting rare: about 30 suspected cases among 23.5 million votes in 2016 (Brennan Center) and 20 noncitizens among 8.2 million registrants in Georgia’s 2024 audit. Individual cases occur, including the 28 people charged in California, but nothing found approaches widespread voting.</p>

</div>

 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
