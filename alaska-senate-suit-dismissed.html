<div id="nr-body">
  <p>On November 1, two days before the election, U.S. District Judge Sharon Gleason in Anchorage dismissed the Justice Department’s lawsuit seeking to delay certification of Alaska’s Senate race if Republican Sen. Dan Sullivan lost to Democrat Mary Peltola. The suit asked the court to set aside and investigate ballots cast for Daniel J. Sullivan, a retired teacher on the ballot who shares the senator’s name, if those votes could have changed the result.</p>
  <p>Gleason ruled that the department lacked standing and “provides no workable plan” to investigate those ballots “in a manner that would preserve voter secrecy,” and that such late changes to election rules are strongly disfavored. Alaska’s Republican-led state government had called the suit meritless. The department filed notice of appeal, saying the case was dismissed “on procedural grounds” and that voters should not be “misled in an attempt to rig outcomes.”</p>
  <p>Trump said he ordered the suit. It followed a New York Times report that Peltola’s campaign staff and Democratic operatives helped recruit the second Sullivan; Peltola denies any role, and the report’s on-record source later sought to retract her comments. Peltola’s campaign called the suit baseless. Federal prosecutors are investigating the candidacy, and Gov. Mike Dunleavy has suggested he may not certify a Peltola win.</p>
  <p><strong>Why it matters:</strong> The race could help decide control of the Senate, and the ruling leaves certification to the state’s normal process for now. It is the latest court rejection of a federal bid to set aside ballots before the midterms, and the appeal and the investigations continue.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Federal courts have long been reluctant to change election procedures close to a vote, under the Supreme Court’s 2006 <em>Purcell</em> decision, and the Constitution leaves the running of elections mainly to the states. Days earlier, courts turned down the department’s bid to set aside about 20,000 California ballots. Same-name spoiler candidates have a history: in Florida’s 2020 state Senate race, a former Republican state senator was charged with paying a no-party candidate named Rodriguez to run against a Democrat of the same name. Our earlier analysis covered the <a href="peltola-second-dan-sullivan.html">report on the second Dan Sullivan</a>.</p>
</div>
<!-- END: historical-context -->

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.foxnews.com/politics/doj-set-appeal-ruling-alaska-senate-race-dispute-over-decoy-dan">Fox</a>: Its headline leads with the Justice Department’s plan to appeal a “dispute over ‘Decoy Dan,’” and its first paragraph places the dismissal “amid the ‘Decoy Dan’ controversy.” It paraphrases the judge and the department’s procedural argument, gives the New York Times report and both Peltola’s and the second Sullivan’s denials, Sen. Sullivan’s pledge to accept the result, and Gov. Mike Dunleavy’s suggestion that he may not certify a Peltola win. It does not say Trump ordered the suit and quotes no one who opposed it. Links inside the story point to “‘Decoy Dan’ Sullivan election scandal” coverage.</li>
    <li><a href="https://www.washingtonexaminer.com/news/justice/4787398/judge-doj-delay-alaska-senate-dan-sullivan-lawsuit/">Washington Examiner</a>: Its first paragraph says the ruling halted the department’s “push for discovery into an alleged Democratic-backed spoiler campaign led by allies of Senate candidate Mary Peltola.” It gives the judge’s reasoning in detail (commingled ballots, standing, the rule against late changes), notes that “legal experts largely echoed” the flaw in the suit, and reports the department’s effort to obtain the Peltola campaign’s communications and financial records. It quotes the Justice Department and Sen. Sullivan; Peltola’s denial is paraphrased in one line.</li>
    <li><a href="https://www.reuters.com/world/us-judge-throws-out-trump-election-lawsuit-alaska-2026-11-01/">Reuters</a>: Calls the ruling “the latest blow to Trump’s efforts to assert a greater federal role in elections” and quotes the judge, the department (“in an attempt to rig outcomes”), Alaska’s elections division and the ACLU. It reports the New York Times account and adds “Reuters has not verified the report,” notes that “it is not clear what, if any, laws may have been broken,” and says both parties have engaged in “ballot stacking.” It says Trump ordered the suit and wants Peltola prosecuted, then adds that the department “has brought criminal charges against a number of Trump’s adversaries.”</li>
    <li><a href="https://apnews.com/article/alaska-senate-dan-sullivan-peltola-investigation-b35acffc8b55ef58679d9b8395760f98">AP</a>: The fullest account. It says the ballot of the second Sullivan “prompted Trump to push for the lawsuit,” quotes the judge, the department, the DSCC, Peltola’s campaign, the NAACP and Sen. Sullivan (“She got caught lying”), and gives the New York Times report, Peltola’s denial and Trump’s “DISAPPEARED!” post. It covers the state courts’ earlier rulings, the state’s steps to tell the candidates apart, Gov. Dunleavy’s warning and the escalating criminal investigation. One line says “Republicans, including ones working with Trump, also have a long history of backing decoy candidates.”</li>
    <li><a href="https://www.cnn.com/2026/11/01/politics/alaska-senate-judge-ruling">CNN</a>: Its first paragraph calls the ruling “the latest legal rebuke to a rash of Trump administration attempts to meddle in the 2026 midterms.” It quotes the judge, including her point that segregating ballots would itself confuse voters, the department and Trump (“one of the most meritful things”), and sets the ruling beside other recent losses for the department, naming each judge’s appointing president. It reports the New York Times account, the criminal probe and the governor’s warning, but not Peltola’s denial or Trump’s role in ordering the suit.</li>
    <li><a href="https://www.ms.now/news/judge-dismiss-alaska-lawsuit-trump-doj-dan-sullivan">MSNOW</a>: Its subhead calls the suit the department’s “second such effort against a state this month.” It quotes the judge, the department, Sen. Sullivan, Peltola’s lawyer Marc Elias and her campaign, and Trump calling Elias and other lawyers “CRIMINALS”; in its own voice it describes lawyers “fighting the administration’s efforts to meddle in the midterm elections.” It adds original reporting that it “could not locate any other instance” of a suit under the voter-registration law the department cited. It does not mention the New York Times report, Peltola’s denial, the criminal probe or the governor.</li>
    <li><a href="https://www.nbcnews.com/politics/2026-election/federal-judge-dismisses-trump-attempt-ballots-alaska-senate-race-rcna606838">NBC News</a>: Leads with the ruling and the judge’s words, “clearly violate Alaskans’ right to a secret ballot,” and says the Republican-led state government asked the court to stop the effort. It quotes Peltola’s campaign and the department in full, and Trump’s post that the second Sullivan “committed a Criminal Act.” It alone reports that the New York Times relied on on-the-record comments from Peltola’s fired campaign manager, who later sought to retract them. It does not say Trump ordered the suit, or mention the earlier state-court rulings or the governor.</li>
    <li><a href="https://www.washingtontimes.com/news/2026/nov/1/judge-tosses-trump-dojs-challenge-dan-sullivan-alaska-ballot/">Washington Times</a>: Says the judge found the requests “impossible” and gives her ballot-secrecy reasoning, then states in its own voice that the second Sullivan’s campaign “has many earmarks of a campaign trick.” It reports the New York Times account and Peltola’s denial, and quotes the DSCC and Democrats on Sunday shows: Sen. Bernie Sanders called the scheme “pretty dumb … but it’s not illegal,” and Rep. Jamie Raskin said it “happens all over the place.” It notes the department quickly appealed but does not quote it, and ties the suit’s lateness to a similar California case.</li>
  </ul>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> “The court dismissed the case on procedural grounds but did not dispute the argument of the United States that Daniel J. Sullivan (a/k/a Decoy Dan) entered the race as a frivolous candidate to confuse voters.”</p>
  <p><strong>Origin:</strong> Justice Department spokesperson, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The judge did dismiss for lack of standing and did not decide why the second Sullivan entered the race. But she also found the requested relief “infeasible,” incompatible with ballot secrecy and too late under the Supreme Court’s rule against last-minute changes. Not ruling on a question is not agreeing with one side’s answer to it.</p>

  <p><strong>Claim:</strong> Alaskan voters should not be “misled in an attempt to rig outcomes.”</p>
  <p><strong>Origin:</strong> Justice Department spokesperson, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The New York Times reported, with an on-record source who later sought to retract her comments, that Peltola’s campaign staff helped recruit the second Sullivan, which is partial support for an effort to draw votes away. Whether that misled voters or could “rig” the outcome is not shown: he won about 2.5% in the primary, the state added identifiers to the ballot, and the department offered no evidence of voter confusion in court.</p>

  <p><strong>Claim:</strong> “The Fake Daniel J. Sullivan, Jr., has DISAPPEARED! Nobody can find him, including Law Enforcement. He knows that he committed a Criminal Act.”</p>
  <p><strong>Origin:</strong> President Trump on social media, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ❌ False</p>
  <p><em>Rationale:</em> Trump cited no evidence, and the record contains none of a crime: the second Sullivan has not admitted any wrongdoing and denies coordinating with Peltola’s campaign, no one has been charged, and no law has been identified that his candidacy broke. Reuters reported it is not clear what law, if any, was broken, and the Alaska Supreme Court ruled he was entitled to appear on the ballot. A grand jury investigation is open, but that is not evidence of a crime, and no report says law enforcement tried and failed to find him.</p>

  <p><strong>Claim:</strong> “No sham investigation or baseless lawsuit from a weaponized Department of Justice is going to stop Alaskans from electing Mary.”</p>
  <p><strong>Origin:</strong> Peltola campaign spokesperson, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The court did find the suit legally deficient. Trump’s public call to prosecute Peltola before the probe was disclosed gives partial support to the charge that the investigation is political, but the investigation follows a published report with an on-record source, and nothing in the record shows it is a sham.</p>

  <p><strong>Claim:</strong> “No one, no matter how powerful, can toss out free and fair elections just because they don’t like the result.”</p>
  <p><strong>Origin:</strong> DSCC Executive Director Devan Barber, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The suit did seek to hold up certification of a Peltola win, which critics called an attempt to overturn the result. But it asked for an investigation only if the second Sullivan’s votes could have changed the outcome, and it rested on alleged voter confusion, not on disliking the result. No election has been thrown out.</p>

</div>

function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};

 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
