<!-- BEGIN: headline -->
<div id="headline">
  <p>Fed Inspector General Finds No Crime or Misconduct in Powell-Era Headquarters Renovation but Faults Cost Controls, and Trump Calls for Powell’s Resignation</p>
</div>
<!-- END: headline -->

<!-- BEGIN: coverage-date -->
<div id="coverage-date">
  <p>October 2, 2026</p>
</div>
<!-- END: coverage-date -->

<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>The Federal Reserve’s inspector general reported on Wednesday that it found no reasonable grounds to believe a federal crime occurred in its evaluation of the renovation of the Fed’s Washington headquarters under former Chair Jerome Powell, and did not identify administrative misconduct. The report also found that the Fed did not take available steps to control costs on a project now estimated at about $2.4 billion, roughly $1 billion above its 2020 budget. Some outlets give the total as nearly $2.5 billion.</p>
  <p>The inspector general said the Fed set no guaranteed maximum price, had no full cost estimate and awarded work in piecemeal packages with little competitive bidding, and it blamed a 2023 switch to closed offices and weak contract management. It found that marble, water features and a garden terrace, which the White House had criticized, did not materially contribute to the cost increases.</p>
  <p>Current Fed Chair Kevin Warsh agreed to the seven recommendations and said the Fed would hire an independent auditor and bring in the General Services Administration. Powell declined to comment.</p>
  <p>President Trump called on Powell to resign, writing that if he does not “he should be sued,” and said he asked Attorney General Todd Blanche to review the report. Senator Elizabeth Warren said there was “no basis to restart the president’s witch hunt.” On Friday a Justice Department spokesperson said the department will not reopen its criminal investigation of Powell, though Blanche has not ruled out acting if the independent audit finds wrongdoing.</p>
  <p><strong>Why it matters:</strong> The report tests two accounts of the renovation: the administration’s that it showed gross mismanagement, and Powell’s that the criminal probe was pressure tied to interest rates. The inspector general found mismanagement but no crime or misconduct, and a federal judge had already found the Justice Department’s subpoenas pretextual.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Powell asked the Fed’s inspector general to review the renovation in July 2025, the month President Trump toured the site with him. In January 2026 the Justice Department opened a criminal investigation tied to whether Powell misled Congress in June 2025 testimony about the project, and served grand jury subpoenas. In a ruling made public on March 13, 2026, U.S. District Judge James Boasberg quashed the subpoenas, writing that there was “abundant evidence” their dominant purpose was to “harass and pressure Powell.” The Justice Department asked him to reconsider, and the investigation closed on April 24, with the matter referred to the inspector general. Kevin Warsh now chairs the Fed. Powell remains a Fed governor, with a term through January 2028.</p>
</div>
<!-- END: historical-context -->

<!-- BEGIN: outlet-coverage -->
<div id="outlet-coverage">

<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>Tennessee officials tried and failed to execute Christa Pike on Wednesday night, and her attorneys said she was alive and in critical condition in a hospital the next day. Pike, 50, was convicted of the 1995 killing of fellow Job Corps student Colleen Slemmer, 19, committed when Pike was 18, and would have been the first woman executed in Tennessee in about 200 years. Gov. Bill Lee halted executions for the year and ordered “a comprehensive, third-party review to determine exactly what occurred.”</p>
  <p>The U.S. Supreme Court had lifted a stay before the attempt. Witnesses said Pike was heard snoring after a backup dose, and she was taken to a hospital. The Department of Correction said it “followed every step of the State’s lawful, established execution protocol.” Pike’s attorneys said she had warned of such problems beforehand and that at least seven needle sticks were needed, and they raised possible brain damage.</p>
  <p>Robin Maher of the Death Penalty Information Center called the case “singular and unparalleled,” and the center says Pike is the first known person to survive an execution after the drugs entered her body. It was Tennessee’s second failed execution this year, after officials called off Tony Carruthers’ in May when they could not place an IV line.</p>
  <p>Pike has not disputed her role in the killing. Reports note her age at the time, allegations of abuse and diagnoses of bipolar disorder and post-traumatic stress disorder. Slemmer’s mother told the Associated Press she did not get justice for her daughter.</p>
  <p><strong>Why it matters:</strong> The case revives questions about whether Tennessee’s lethal injection protocol works, after a pause that began in 2022 over drug-testing problems and a 2024 switch to a single drug. The state has not said why the drug did not kill her, and the review is not yet complete.</p>
</div>

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>On January 12, 1995, Pike, then 18, and Colleen Slemmer, 19, were students at a Job Corps center in Knoxville. According to the Tennessee Supreme Court’s 1998 opinion, Pike lured Slemmer to an isolated area near the University of Tennessee campus by mentioning hidden drugs. Pike, her boyfriend Tadaryl Shipp and Shadolla Peterson took part in an attack that lasted 30 minutes to an hour, using a box cutter and a small meat cleaver. Slemmer suffered slash and stab wounds and skull fractures, and a pentagram was carved on her chest. Pike removed a piece of her skull and showed it to friends. Pike was sentenced to death, plus 25 years for conspiracy.</p>
</div>

<div id="fc-claims">

  <p><strong>Claim:</strong> Pike was still alive and in critical condition the day after the attempt.</p>
  <p><strong>Origin:</strong> Pike’s attorneys, repeated across coverage.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Several outlets report her attorneys’ account that she was alive and receiving care in a hospital, and the state moved her there after the attempt. Her condition could change, so this reflects reporting as of October 1.</p>

  <p><strong>Claim:</strong> Officials gave Pike two doses of pentobarbital.</p>
  <p><strong>Origin:</strong> Media witnesses and Pike’s attorneys.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Witness accounts and her attorneys describe a first dose and a backup dose, and the protocol provides for a second set. The state has not published a dose count, so the official account awaits the governor’s review.</p>

  <p><strong>Claim:</strong> Problems Pike and her lawyers warned about beforehand, such as difficult veins, caused the failure.</p>
  <p><strong>Origin:</strong> Pike’s attorneys.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Her lawyers say at least seven needle sticks were needed and that drugs may have leaked into her arm. Officials have not said why the drug did not kill her, and the third-party review is still pending.</p>

  <p><strong>Claim:</strong> The Department of Correction followed every step of its execution protocol.</p>
  <p><strong>Origin:</strong> A Department of Correction statement.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The governor said staff appeared to follow procedure, but he also called the outcome deeply disturbing and ordered a review of what occurred. No outside reviewer has yet confirmed the department’s account.</p>

  <p><strong>Claim:</strong> Pike is the first known person to survive an execution after the drugs entered her body.</p>
  <p><strong>Origin:</strong> Robin Maher of the Death Penalty Information Center and other death penalty experts.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Coverage says seven other people survived failed attempts when staff could not reach a vein, but none survived after receiving the drugs. The claim rests on the center’s documentation, so it is best read as the first documented case.</p>

<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>The Trump administration has paid for a national television ad campaign praising the president and his policies, aired on Fox, Newsmax, CNN and MS NOW, and on October 5 Trump said taxpayers would stop footing the bill. “I have decided to do the Patriotic Ads, among others, and pay for them myself, and with money I raised for MAGA, Inc.,” he wrote. MAGA Inc. is a super PAC that reported nearly $416 million in cash at the end of August.</p>
  <p>The Department of Homeland Security set aside $20 million for the campaign; two Democratic senators said the money came from funds meant for Customs and Border Protection. AdImpact estimated that nearly $12 million in ads had aired. The spots carry a “Paid for by the U.S. Government” label, and one replays an ad from Trump’s 2024 campaign. On October 6 a White House official said Trump had “no plans to reimburse the federal government,” and Trump, asked about repayment, said, “We’ll decide.”</p>
  <p>The White House and Vice President JD Vance defended the ads as “public service announcements” like those of past administrations. Ethics watchdogs and Democrats said they may violate a federal law barring appropriated money from being used for “publicity or propaganda.” Senate Minority Leader Chuck Schumer demanded repayment, Republican senators including Majority Leader John Thune said taxpayers should not pay, and California Attorney General Rob Bonta called the campaign a “staggering misuse of public funding and breach of public trust.” On October 7 the Democratic National Committee sued in federal court in Washington to stop the spending.</p>
  <p><strong>Why it matters:</strong> The ads aired weeks before the midterm elections, and the dispute tests where government messaging ends and campaigning begins. Whether the money already spent will be repaid is unresolved.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>For decades Congress has barred appropriated money from being used for “publicity or propaganda purposes” not authorized by law, and the Government Accountability Office rules on alleged violations in legal decisions; it cannot impose penalties. In 2005 it found that the Education Department broke the ban by paying commentator Armstrong Williams to promote the No Child Left Behind Act without disclosing the payment. In 2015 it found that the Environmental Protection Agency broke it with a social media campaign for a clean water rule. Administrations of both parties have also paid for ads promoting government programs, such as enrollment drives for health insurance under the Affordable Care Act.</p>
</div>
<!-- END: historical-context -->

    <li><a href="https://www.reuters.com/world/us/trump-says-will-pay-tv-ads-after-pushback-over-taxpayer-funding-close-election-2026-10-05/">Reuters</a>: Published October 5, before the repayment question arose, and leads with Trump ending taxpayer funding. It adds the widest legal and regulatory context, including Bonta’s call for an investigation and the FCC chair’s refusal to open one, and notes that one ad closely resembles a 2024 campaign ad. Tone is straight news.</li>
    <li><a href="https://apnews.com/article/trump-taxpayer-funded-ads-super-pac-reimburse-d728ad3cf091576d09a63d9218be3fe2">AP</a>: Leads with Trump not committing to repay and his “We’ll decide” answer, then gives AdImpact’s spending estimate, the source of the $20 million, criticism from Schumer and Republicans Thune and Britt, and a paragraph on the propaganda law. Tone is straight news, with “glorifying the president” as its one evaluative phrase.</li>

    <li><a href="https://www.ms.now/news/trump-says-hell-personally-pay-for-taxpayer-funded-ads-after-bipartisan-backlash">MSNOW</a>: Published October 5 and centers the White House statement that MAGA Inc. will pay “moving forward,” noting it is unclear when taxpayer funding ends. It reports the CBP source of the money, named Republican critics Thune and Kennedy, and experts doubting the PSA comparison, in a straight-news tone that differs from the network’s related opinion pieces and videos calling the ads propaganda.</li>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Trump will pay for the ads himself.</p>
  <p><strong>Origin:</strong> Trump, on Truth Social.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The same post says the money will come from MAGA Inc., a super PAC funded by donors, and a White House official said only future ads are covered. Spending already made from taxpayer funds will not be repaid, according to the White House.</p>

  <p><strong>Claim:</strong> The ads are public service announcements like those run by past administrations.</p>
  <p><strong>Origin:</strong> The White House and Vice President JD Vance.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Past administrations did run government-funded ads promoting programs. These spots center on Trump himself, AP reports that one replays a 2024 campaign ad, and ethics experts quoted by MSNOW doubt the comparison.</p>

  <p><strong>Claim:</strong> The ad campaign violates the federal law against using appropriated money for publicity or propaganda.</p>
  <p><strong>Origin:</strong> Ethics watchdogs and Democratic lawmakers, including Sen. Chuck Schumer.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Legal experts quoted by AP and CNN say the ads may violate the law, and the replayed campaign ad strengthens that case. The Democratic National Committee sued on October 7, but no court, the Government Accountability Office or an inspector general has ruled, so a violation is not established.</p>

  <p><strong>Claim:</strong> The Department of Homeland Security set aside $20 million for the campaign.</p>
  <p><strong>Origin:</strong> Democratic senators, repeated across coverage.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> All five outlets report the $20 million figure, attributed to Democratic lawmakers or reporting on the DHS contract. The claim that it came from Customs and Border Protection funds rests on two Democratic senators and has not been confirmed by DHS.</p>

  <p><strong>Claim:</strong> Nearly $12 million in ads had already aired.</p>
  <p><strong>Origin:</strong> AdImpact, an ad-tracking firm, as cited by AP.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> CNN and MSNOW cite the same firm at about $10 million in their October 5 reports, and AP’s later figure is nearly $12 million. These are estimates of airtime, not government accounting, so the final cost is unknown.</p>

</div>

  const bt=E('button','b g',full?'Zoom in on outlets':'Show full scale');bt.onclick=()=>{full=!full;draw()};n.append(bt);wrap.append(n)}};
 draw();return wrap}
const CVC={full:'#15803d',brief:'#b7791f',omitted:'#c62828',not_checked:'#6b7280',dated:'#6b7280'};
function covGrid(cv,names){const w=E('div'),K=CONTRACT.coverage;(cv.facts||[]).forEach(f=>{const row=(cv.cells||{})[f.id]||{};
 w.append(E('div','vf','<div><span class="tag">'+esc(K.weights[f.weight]||f.weight)+'</span><span class="tag">'+esc(K.categories[f.category]||f.category)+'</span></div><div><b>'+esc(f.text)+'</b></div><div class="sm">Source: '+esc(f.source||'')+'</div><div>'+Object.keys(names).map(k=>{const st=row[k]||'not_checked';return '<span class="v" style="background:'+(CVC[st]||'#6b7280')+';margin-right:6px">'+esc(names[k])+': '+esc(K.statuses[st]||st)+'</span>'}).join('')+(cv._nc||[]).map(o=>'<span class="v" style="background:#9aa1ad;margin-right:6px">'+esc(o.outlet)+': '+esc(CONTRACT.not_covered.grid_label)+'</span>').join('')+'</div>'))});
 w.append(E('p','note','Strategic Silence ratings follow this grid: an outlet that leaves out a central or important fact cannot be rated None.'));return w}
function ncOC(el,NC,isNotes){if(!NC.length)return el;const K=CONTRACT.not_covered,ul=el.querySelector('ul')||el;NC.forEach(o=>ul.append(E('li','',isNotes?esc(o.outlet)+': Not placed on the map. It ran no article on this story ('+esc(o.window||'')+'), which the metrics record as Severe Strategic Silence.':'<b>'+esc(o.outlet)+'</b>: '+esc(K.status_label)+' ('+esc(o.window||'')+'). Searched: '+esc(o.searched||'')+'.')));return el}
function ncCred(w,NC){if(!NC.length)return w;const K=CONTRACT.not_covered;NC.forEach(o=>w.append(E('div','row','<span>'+esc(o.outlet)+'</span><div class="trk" role="img" aria-label="'+esc(K.row_label)+'" style="display:flex;align-items:center;padding-left:8px;font:12px Arial,sans-serif;color:var(--mut)">'+esc(K.row_label)+'</div><b>—</b>')));w.append(E('p','note','No score for an outlet with no article: accuracy and framing cannot be rated, and its silence is recorded under Comparative Metrics.'));return w}
function ncHeat(w,NC){if(!NC.length)return w;const K=CONTRACT.not_covered,tb=w.querySelector('tbody'),panel=w.querySelector('.panel');NC.forEach(o=>{const tr=E('tr','','<td>'+esc(o.outlet)+'</td>');['spin','silence','distortion','factual'].forEach(m=>{const td=E('td');if(m==='silence'){const wd=K.silence_word,l=lvl('silence',wd),b=E('button','cell',esc(wd));b.style.background=hue(l);b.setAttribute('aria-pressed','false');b.onclick=()=>{w.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');panel.style.display='block';panel.innerHTML='<b>'+esc(o.outlet)+' — Strategic Silence: '+esc(wd)+'</b><ul><li>'+esc(K.silence_reason)+'</li><li>Searched: '+esc(o.searched||'')+'; '+esc(o.window||'')+'.</li></ul>'};td.append(b)}else{const d=E('div','cell','—');d.style.background='var(--trk)';d.style.cursor='default';d.style.boxSizing='border-box';d.title=K.row_label;td.append(d)}tr.append(td)});tb.append(tr)});return w}
function ncFrame(w,NC){NC.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(CONTRACT.not_covered.row_label)+'</span><div class="sm">No article, so there were no images to review.</div>')));return w}
function methodCard(){const M=CONTRACT.methodology,W=CONTRACT.credibility,c=card('How this analysis works',E('div')),b=c.lastChild;
 b.append(E('p','',esc(M.intro)));
 const mt=E('div');Object.entries(CONTRACT.metrics).forEach(([k,v])=>{let h='<p><b>'+esc(v.label)+'</b></p><table><tbody>'+v.words.map((w,i)=>'<tr><td style="width:24%"><span class="v" style="background:'+hue(i)+';color:#111">'+esc(w)+'</span></td><td style="text-align:left">'+esc((M.metric_definitions[k]||{})[w]||'')+'</td></tr>').join('')+'</tbody></table>';mt.append(E('div','',h))});
 mt.append(E('p','note','Green is better and red is worse on every scale.'));b.append(det('Comparative metrics: what each word means',mt));
 const cw=W.weights,lab=W.weight_labels;let h='<p>Credibility scores are calculated from the ratings, not judged separately. Each rating level converts to points ('+W.points.join(', ')+' from best to worst), and the points are weighted:</p><ul>'+Object.keys(cw).map(k=>'<li>'+esc(lab[k])+': '+cw[k]+'%</li>').join('')+'</ul><p>Imagery counts fully when the image was viewed, half when only the caption was read, and not at all when it was not reviewed; unused weight is spread across the rest. Bands: '+W.bands.map(x=>esc(x[0].replace(/^Below/,'below'))+' '+esc(x[1]).toLowerCase()).join('; ')+'.</p>';
 b.append(det('Credibility score',E('div','',h)));
 b.append(det('Fact-check verdicts',E('div','','<ul>'+Object.entries(M.verdict_definitions).map(([k,v])=>'<li><b>'+esc(k)+'</b>: '+esc(v)+'</li>').join('')+'</ul>')));
 const K=CONTRACT.coverage;b.append(det('Coverage grid and missing coverage',E('div','','<p>The grid lists the facts central or important to the story and marks each outlet: '+Object.values(K.statuses).map(esc).join(', ')+'. Facts that came out after an outlet published are marked as not yet reported and are not counted against it. Strategic Silence cannot be rated below what the grid shows: a missing central fact means at least High, three or more missing important facts at least Moderate, one or two at least Mild.</p><p>'+esc(M.not_covered)+'</p>')));
 b.append(det('Bias map',E('div','','<p>'+esc(M.bias_map)+'</p>')));
 b.append(det('Visual framing and images',E('div','','<p>'+esc(M.imagery)+'</p><p>The image at the top of each analysis is public domain or openly licensed, credited in its caption.</p>')));
 b.append(det('Checks against bias in the analysis itself',E('div','','<p>'+esc(M.mirror_test)+'</p><p>Scores are also checked against a standing-reputation ranking: an outlet that was unusually careful or careless on this story is scored that way.</p>')));
 if(/^https:\/\//.test(M.url||''))b.append(E('p','','<a href="'+esc(M.url)+'" target="_blank" rel="noopener noreferrer">'+esc(M.url_label)+'</a>'));
 return c}
function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(K.status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));w.append(E('p','note',K.note));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
function render(src){const{b,rest}=parse(src),out=$('#out');out.innerHTML='';
 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}
 const D=runData(b),el=id=>b[id]?clean(dom(b[id]).firstElementChild||dom(b[id])):null,tx=id=>el(id)?el(id).textContent.trim():'';
 out.append(E('h1','',esc(tx('headline')||'Untitled analysis')));if(tx('coverage-date'))out.append(E('p','date','Coverage as of '+esc(tx('coverage-date'))));
 const NC=(D.notCovered&&D.notCovered.outlets)||[];if(D.cred)out.append(E('div','chips',[...D.cred.scores].sort((a,b)=>b.score-a.score).map(o=>'<span class="chip" style="background:'+col(o.class)+'">'+esc(o.outlet)+'</span>').join('')+NC.map(o=>'<span class="chip nc" title="'+esc(CONTRACT.not_covered.status_label)+'">'+esc(o.outlet)+': '+esc(CONTRACT.not_covered.chip_suffix)+'</span>').join('')));
 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}
 if(el('nr-body')){const bc=card('Baseline Record',el('nr-body')),DL=CONTRACT.dropdown_labels;if(el('historical-context'))bc.append(det(DL['historical-context'],el('historical-context')));if(el('outlet-coverage'))bc.append(det(DL['outlet-coverage'],ncOC(el('outlet-coverage'),NC)));if(D.coverage&&D.coverage.facts){const nm={};((D.cm&&D.cm.rows)||[]).forEach(r=>nm[r.class]=r.outlet);D.coverage._nc=NC;bc.append(det(DL['coverage-grid'],covGrid(D.coverage,nm)))}out.append(bc)}else if(el('outlet-coverage'))out.append(card('Outlet Coverage',el('outlet-coverage')));
 if(NC.length)out.append(card(CONTRACT.not_covered.label,ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card('Comparative Metrics',ncHeat(heat(D.cm),NC)));
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias));if(NC.length)bm.append(E('p','note','Not placed on the map (no coverage): '+NC.map(o=>esc(o.outlet)).join(', ')+'.'));out.append(bm)}
 if(el('bias-notes'))out.append(card('Bias Notes',ncOC(el('bias-notes'),NC,1)));
 if(D.imagery&&D.imagery.records)out.append(card('Visual Framing',ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card('Visual Framing',E('div'));c.lastChild.append(det('Imagery by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
