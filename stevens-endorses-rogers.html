<div id="nr-body">
  <p>On November 1, two days before the election, Rep. Haley Stevens of Michigan, who narrowly lost the Democratic Senate primary to Abdul El-Sayed in August, attended a Detroit church service with Republican nominee Mike Rogers and endorsed him. “Our Democratic nominee for U.S. Senate, Abdul, said that I was no longer welcome in his campaign and that I should stay away. And he’s right,” she said in a video, adding that she would not “stand with Hasan Piker.”</p>
  <p>The switch followed a week-long dispute. Stevens demanded that El-Sayed condemn an outside group’s ad linking grocery prices to U.S. military aid to Israel, which she and Jewish leaders called antisemitic; he said the ad was not his and he disagreed with it. His campaign then asked her to skip its remaining events. Stevens had reassured fellow Democrats as late as Saturday night that she would vote for him, and in August she had called Rogers “another rubber stamp for Donald Trump’s dangerous agenda.”</p>
  <p>Sen. Chuck Schumer called the endorsement “a despicable betrayal,” the state party chair said Stevens is no longer a party member, and her chief of staff and other aides resigned. President Trump praised her “bravery.” El-Sayed said, “I actually don’t think about Haley Stevens.”</p>
  <p><strong>Why it matters:</strong> Michigan’s open seat could help decide control of the Senate, and Stevens drew strong support from Black and Jewish Democrats in the primary. Polls before the vote showed El-Sayed ahead, and more than 1.8 million Michiganders had already voted.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Prominent politicians have crossed party lines late in a campaign before: Democratic Sen. Joe Lieberman endorsed Republican John McCain for president in 2008, and Republican former Rep. Liz Cheney endorsed Democrat Kamala Harris in 2024. Endorsements by a defeated primary rival of the other party’s nominee are rarer, especially in the final days, when most votes in some states have already been cast.</p>
</div>

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.foxnews.com/politics/haley-stevens-appears-alongside-gop-rival-mike-rogers-detroit-church">Fox</a>: Published about an hour after the endorsement, it gives Stevens’ video, Rogers’ remarks outside the church and the backstory: her disinvitation, the outside group’s ad, El-Sayed’s statement that he disagreed with it, and her fiancé’s earlier endorsement of Rogers. It says in its own voice that she has criticized El-Sayed’s “unwillingness to condemn the overt antisemitism of some of his supporters.” Fox’s follow-up headlines framed Democrats’ reaction as “radical left-wing voices erupting,” and another said her “endorsement stunt backfires.”</li>
    <li><a href="https://www.washingtonexaminer.com/news/campaigns/congressional/4787330/haley-stevens-endorses-mike-rogers-el-sayed/">Washington Examiner</a>: Leads with Stevens “bucking her support” for El-Sayed after “a dayslong feud,” then quotes her video, El-Sayed’s “None of this matters,” Trump’s Truth Social post at length and Schumer’s statement, including his charge of “racist, Islamophobic, and over-the-top false attacks” on El-Sayed by Republicans. It reprints Stevens’ Friday statement on the ad, which it says Jewish leaders condemned as antisemitic, and El-Sayed’s reply that she was relitigating the primary.</li>
    <li><a href="https://www.reuters.com/world/us/trump-heads-iowa-kansas-rallies-before-midterms-2026-11-01/">Reuters</a>: Its first paragraph says the endorsement gave “President Donald Trump’s Republicans an unexpected boost.” It quotes Stevens, Rogers (“virulent hate”) and Trump’s invitation to join his party, explains the ad and her disinvitation, and says in its own voice that Trump “repeated false claims that El-Sayed is a ‘jihadist’ - attacks that fit a broader pattern of inflammatory rhetoric” toward Arab Americans and Muslims. It cites a poll showing El-Sayed ahead but quotes no Democrat reacting to the switch.</li>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> El-Sayed “said that I was no longer welcome in his campaign and that I should stay away.”</p>
  <p><strong>Origin:</strong> Rep. Haley Stevens, endorsement video, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> El-Sayed’s campaign asked Stevens to skip its remaining events, a request Rep. Debbie Dingell said she delivered because the dispute had become distracting. El-Sayed did not say she was unwelcome in so many words, but the request to stay away is on the record.</p>

  <p><strong>Claim:</strong> The Rebellion PAC ad “claimed Israel and Jews were to blame for the high costs of groceries.”</p>
  <p><strong>Origin:</strong> Rep. Haley Stevens, statement of October 31, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The ad links grocery prices to U.S. military aid to Israel and the war in Gaza and shows Israeli leaders; transcripts published by Newsweek and others show it does not mention Jews. Stevens and several Jewish leaders called the ad antisemitic, which is a judgment about its message, not what it says.</p>

  <p><strong>Claim:</strong> El-Sayed is “a jihadist Muslim Brotherhood member.”</p>
  <p><strong>Origin:</strong> President Trump at a rally in Port Huron, Michigan, October 25, 2026; repeated as “jihadist” in Iowa on November 1.</p>
  <p><strong>Verdict:</strong> ❌ False</p>
  <p><em>Rationale:</em> Trump cited no evidence, and none has been reported that El-Sayed belongs to the Muslim Brotherhood or advocates violent jihad; he denies any extremist ties. A 2012 social-media post by his half-sister about family ties to the group is not evidence about him.</p>

  <p><strong>Claim:</strong> El-Sayed has a “radical, terrorist-sympathizing agenda.”</p>
  <p><strong>Origin:</strong> Republican National Committee spokesman Hunter Lovell, November 1, 2026.</p>
  <p><strong>Verdict:</strong> ❌ False</p>
  <p><em>Rationale:</em> The RNC cited no statement or action by El-Sayed showing sympathy for terrorism, and none has been reported. His sharp criticism of Israel’s conduct in Gaza, his call to end U.S. military aid, and his appearances with a streamer whose comments praising Hamas over Israel were widely denounced do not show that.</p>

</div>
<!-- END: fc-claims -->

<!-- BEGIN: hypocrisy -->
<div id="hypocrisy">
  <p><strong>Baseline (prior statement):</strong> In August 2026, after the primary, Stevens posted that Rogers would be “another rubber stamp for Donald Trump’s dangerous agenda. We can’t afford to give MAGA another Senate seat in November.” She endorsed El-Sayed and, days before the election, texted staff “Omg why would you think I would do that??!!” when urged not to back Rogers.</p>
  <p><strong>Follow-up (current case):</strong> On November 1, 2026, Stevens endorsed Rogers, saying El-Sayed’s campaign had told her to stay away and that she would not “stand with Hasan Piker.”</p>
  <p><strong>Assessment:</strong> Severity 5 — A direct reversal of a stated position on the same candidate within three months. Her reasons concern El-Sayed’s campaign, not any change in her view of Rogers, and she could not explain on CNN what changed between Saturday night and Sunday morning.</p>
</div>

function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
function render(src){const{b,rest}=parse(src),out=$('#out');out.innerHTML='';
 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}
 const D=runData(b);setRank(D);const el=id=>b[id]?clean(dom(b[id]).firstElementChild||dom(b[id])):null,tx=id=>el(id)?el(id).textContent.trim():'';

 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}
 if(el('nr-body')){const bc=card(ST['nr-body'],el('nr-body')),DL=CONTRACT.dropdown_labels;if(el('historical-context'))bc.append(det(DL['historical-context'],el('historical-context')));if(el('outlet-coverage')){const oc=el('outlet-coverage');((D.cred&&D.cred.scores)||[]).filter(o=>wireTxt(o)||viaTxt(o)||typeTxt(o)||placeOf(D,o)).forEach(o=>oc.querySelectorAll('li').forEach(li=>{const a=li.querySelector('a');if(a&&a.textContent.trim()===o.outlet)li.insertAdjacentHTML('beforeend',[wireTxt(o),viaTxt(o),typeTxt(o),placeOf(D,o)].filter(Boolean).map(t=>' <span class="tag wt2">'+esc(t)+'</span>').join(''))}));liRank(oc);if(D.placement&&D.placement.checked_at)oc.append(E('p','note','Homepages checked '+esc(D.placement.checked_at)+'. '+esc(CONTRACT.placement.note)));bc.append(det(DL['outlet-coverage'],ncOC(oc,NC)))}if(D.network&&D.network.outlets)bc.append(det(DL['network-coverage'],netList(D.network)));if(D.coverage&&D.coverage.facts){const nm={};((D.cm&&D.cm.rows)||[]).forEach(r=>nm[r.class]=r.outlet);D.coverage._nc=NC;bc.append(det(DL['coverage-grid'],covGrid(D.coverage,nm)))}out.append(bc)}else if(el('outlet-coverage'))out.append(card('Outlet Coverage',el('outlet-coverage')));
 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('🤔 Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));
 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
