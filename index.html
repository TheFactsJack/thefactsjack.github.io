const col=c=>COL[c]||'hsl('+([...String(c)].reduce((a,x)=>a+x.charCodeAt(0),0)*47%360)+',55%,42%)';

const det=(t,n,open)=>{const d=E('details');if(open)d.open=true;d.append(E('summary','',esc(t)));d.append(n);return d};
function entries(el){const out=[];let cur=null;el.querySelectorAll('p').forEach(p=>{const l=p.querySelector('strong,em');if(!l)return;const k=l.textContent.replace(':','').trim().toLowerCase();const v=p.textContent.replace(l.textContent,'').trim();if(k==='claim'){cur={claim:v};out.push(cur)}else if(cur)cur[k]=v});return out}

function credBars(s){const w=E('div');[...s].sort((a,b)=>b.score-a.score).forEach(o=>w.append(E('div','row','<span>'+esc(o.outlet)+'</span><div class="trk" role="img" aria-label="'+o.score+' of 100"><div class="grad"></div><div class="cov" style="width:'+(100-o.score)+'%"></div></div><b>'+o.score+'</b>')));return w}
const GL={spin:['None','Minimal','Mild','Moderate','High','Severe'],factual:['Excellent','Very Good','Good','Fair','Poor','Very Poor']};GL.silence=GL.distortion=GL.spin;
const lvl=(m,v)=>typeof v==='number'?Math.max(0,Math.min(5,m==='factual'?v-1:v)):GL[m].findIndex(w=>w.toLowerCase()===String(v).toLowerCase());
const hue=l=>l<0?null:'hsl('+Math.round(125*(1-l/5))+',62%,78%)';
function heat(cm){const M=[['spin','Spin'],['silence','Strategic Silence'],['distortion','Media Distortion'],['factual','Factual Integrity']];
 const w=E('div'),sc=E('div','scroll'),t=E('table'),panel=E('div','panel');panel.style.display='none';
 t.innerHTML='<thead><tr><th></th>'+M.map(m=>'<th>'+m[1]+'</th>').join('')+'</tr></thead>';const tb=E('tbody');
 cm.rows.forEach(r=>{const tr=E('tr','','<td>'+esc(r.outlet)+'</td>');M.forEach(m=>{const l=lvl(m[0],r[m[0]]),word=l<0?String(r[m[0]]):GL[m[0]][l],td=E('td'),b=E('button','cell',esc(word));
  b.style.background=hue(l)||'var(--trk)';if(l<0)b.title='Not in glossary';b.setAttribute('aria-pressed','false');
  b.onclick=()=>{t.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const R=(cm.rationales||[]).find(q=>q.id===r.class),mm=R&&R.rationales.find(q=>q.metricId===m[0]);
   panel.style.display='block';panel.innerHTML='<b>'+esc(r.outlet)+' — '+m[1]+': '+esc(word)+'</b>'+(mm?'<ul>'+mm.criteria.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':'<p class="sm">No rationale included for this cell.</p>')};
  td.append(b);tr.append(td)});tb.append(tr)});
 t.append(tb);sc.append(t);w.append(sc,panel,E('p','note','Green is better, red is worse, on every scale. Select a cell for the rationale.'));return w}
const EV={viewed:['Viewed','#15803d'],caption:['Caption only','#b7791f'],not_reviewed:['Not reviewed','#6b7280']};

 w.append(E('div','vf',h))});return w}
function biasMap(B){const x0=76,x1=612,y0=44,y1=330,FS=24,X=l=>x0+(l-B.lean_min)/(B.lean_max-B.lean_min)*(x1-x0),Y=s=>y1-(s-B.str_min)/(B.str_max-B.str_min)*(y1-y0);

 for(let v=B.str_min;v<=B.str_max;v++)s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#c9cfd9" stroke-dasharray="3 4"/><text x="'+(x0-12)+'" y="'+(Y(v)+8)+'" text-anchor="end">'+v+'</text>';

 const pts=B.outlets.map(o=>({o,px:X(o.lean),py:Y(o.strength)})),boxes=[],R=13;

 const dots=pts.map(q=>({x:q.px-R,y:q.py-R,w:2*R,h:2*R}));
 pts.forEach((q,qi)=>{const w=q.o.name.length*FS*0.6,h=FS,g=R+6,
  C=[[q.px+g,q.py+8,'start'],[q.px-g,q.py+8,'end'],[q.px,q.py-g-4,'middle'],[q.px,q.py+g+h-4,'middle'],[q.px+g,q.py-h*0.6,'start'],[q.px-g,q.py-h*0.6,'end'],[q.px+g,q.py+h+2,'start'],[q.px-g,q.py+h+2,'end']];
  const box=c=>({x:c[2]==='start'?c[0]:c[2]==='end'?c[0]-w:c[0]-w/2,y:c[1]-h+4,w,h:h});
  const ok=c=>{const b=box(c);return b.x>=2&&b.x+b.w<=638&&b.y>=2&&b.y+b.h<=y1+34&&!boxes.some(k=>ov(b,k))&&!dots.some((d,di)=>di!==qi&&ov(b,d))&&!ov(b,dots[qi])};
  const c=C.find(ok)||C[0];boxes.push(box(c));q.lx=c[0];q.ly=c[1];q.anchor=c[2]});
 pts.forEach(q=>{const o=q.o;s+='<g><title>'+esc(o.name)+': lean '+o.lean+', strength '+o.strength+'</title><circle cx="'+q.px+'" cy="'+q.py+'" r="11" fill="'+col(o.class)+'" stroke="#fff" stroke-width="2.5"/><text x="'+q.lx+'" y="'+q.ly+'" text-anchor="'+q.anchor+'" style="fill:var(--fg);font-weight:700">'+esc(o.name)+'</text></g>'});
 return E('div','',s+'</svg>')}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));

  <p>Trump Says MAGA Inc. Will Pay for Taxpayer-Funded Ads Praising Him, as the White House Declines to Repay Money Already Spent</p>

<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>The Trump administration has paid for a national television ad campaign praising the president and his policies, and on October 5 Trump said taxpayers would stop footing the bill. “I have decided to do the Patriotic Ads, among others, and pay for them myself, and with money I raised for MAGA, Inc.,” he wrote. MAGA Inc. is a super PAC that reported nearly $416 million in cash at the end of August.</p>
  <p>The Department of Homeland Security set aside $20 million for the campaign; two Democratic senators said the money came from funds meant for Customs and Border Protection. AdImpact estimated that nearly $12 million in ads had aired. The spots carry a “Paid for by the U.S. Government” label, and one replays an ad from Trump’s 2024 campaign. On October 6 a White House official said Trump had “no plans to reimburse the federal government,” and Trump, asked about repayment, said, “We’ll decide.”</p>
  <p>The White House and Vice President JD Vance defended the ads as “public service announcements” like those of past administrations. Ethics watchdogs and Democrats said they may violate a federal law barring appropriated money from being used for “publicity or propaganda.” Senate Minority Leader Chuck Schumer demanded repayment, Republican senators including Majority Leader John Thune said taxpayers should not pay, and California Attorney General Rob Bonta called the campaign a “staggering misuse of public funding and breach of public trust.” No court or auditor has ruled.</p>
  <p><strong>Why it matters:</strong> The ads aired weeks before the midterm elections, and the dispute tests where government messaging ends and campaigning begins. Whether the money already spent will be repaid is unresolved.</p>
</div>
<!-- END: nr-body -->

    <li><a href="https://www.reuters.com/world/us/trump-says-will-pay-tv-ads-after-pushback-over-taxpayer-funding-close-election-2026-10-05/">Reuters</a>: Published October 5, before the repayment question arose, and leads with Trump ending taxpayer funding. It adds the widest legal and regulatory context, including Bonta’s call for an investigation and the FCC chair’s refusal to open one, and notes that one ad closely resembles a 2024 campaign ad. Tone is straight news.</li>
    <li><a href="https://apnews.com/article/trump-taxpayer-funded-ads-super-pac-reimburse-d728ad3cf091576d09a63d9218be3fe2">AP</a>: Leads with Trump not committing to repay and his “We’ll decide” answer, then gives AdImpact’s spending estimate, the source of the $20 million, criticism from Schumer and Republicans Thune and Britt, and a paragraph on the propaganda law. Tone is straight news, with “glorifying the president” as its one evaluative phrase.</li>
    <li><a href="https://www.cnn.com/2026/10/05/politics/trump-taxpayer-funded-ads-super-pac">CNN</a>: Reports the switch to MAGA Inc. and the White House’s refusal to repay, and adds original reporting: it obtained 12 of at least 13 ads from the contractor and shows stills from two. It reports, in a straight-news tone, that Trump personally drove the campaign and that unnamed watchdogs see a clear violation.</li>
    <li><a href="https://www.ms.now/news/trump-says-hell-personally-pay-for-taxpayer-funded-ads-after-bipartisan-backlash">MSNOW</a>: Published October 5 and centers the White House statement that MAGA Inc. will pay “moving forward,” noting it is unclear when taxpayer funding ends. It reports the CBP source of the money, named Republican critics Thune and Kennedy, and experts doubting the PSA comparison, in a straight-news tone that differs from the network’s related opinion pieces and videos calling the ads propaganda.</li>

<div id="fc-claims">

  <p><strong>Claim:</strong> Trump will pay for the ads himself.</p>
  <p><strong>Origin:</strong> Trump, on Truth Social.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The same post says the money will come from MAGA Inc., a super PAC funded by donors, and a White House official said only future ads are covered. Spending already made from taxpayer funds will not be repaid, according to the White House.</p>

  <p><strong>Claim:</strong> The ads are public service announcements like those run by past administrations.</p>
  <p><strong>Origin:</strong> The White House and Vice President JD Vance.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Past administrations did run government-funded ads promoting programs. These spots center on Trump himself, AP reports that one replays a 2024 campaign ad, and ethics experts quoted by MSNOW doubt the comparison.</p>

  <p><strong>Claim:</strong> The ad campaign violates the federal law against using appropriated money for publicity or propaganda.</p>
  <p><strong>Origin:</strong> Ethics watchdogs and Democratic lawmakers, including Sen. Chuck Schumer.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Legal experts quoted by AP and CNN say the ads may violate the law, and the replayed campaign ad strengthens that case. No court, the Government Accountability Office or an inspector general has ruled, and it is unclear who has standing to sue, so a violation is not established.</p>

  <p><strong>Claim:</strong> The Department of Homeland Security set aside $20 million for the campaign.</p>
  <p><strong>Origin:</strong> Democratic senators, repeated across coverage.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> All five outlets report the $20 million figure, attributed to Democratic lawmakers or reporting on the DHS contract. The claim that it came from Customs and Border Protection funds rests on two Democratic senators and has not been confirmed by DHS.</p>

  <p><strong>Claim:</strong> Nearly $12 million in ads had already aired.</p>
  <p><strong>Origin:</strong> AdImpact, an ad-tracking firm, as cited by AP.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> CNN and MSNOW cite the same firm at about $10 million in their October 5 reports, and AP’s later figure is nearly $12 million. These are estimates of airtime, not government accounting, so the final cost is unknown.</p>
