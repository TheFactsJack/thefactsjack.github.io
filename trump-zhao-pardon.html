<div id="nr-body">
  <p>On October 23, 2025, the White House announced that President Donald Trump had granted a full and unconditional pardon to Changpeng Zhao, the founder of Binance, the world’s largest cryptocurrency exchange. Zhao pleaded guilty in 2023 to failing to maintain an effective anti-money-laundering program, a Bank Secrecy Act violation; he paid a $50 million fine and served four months in prison, and Binance paid $4.3 billion. Prosecutors said Binance had failed to report or block transactions involving groups such as Hamas and al Qaeda.</p>
  <p>Press secretary Karoline Leavitt said Zhao was “prosecuted by the Biden Administration in their war on cryptocurrency,” with “no allegations of fraud or identifiable victims.” Trump said, “I don’t know him, I don’t believe I’ve ever met him,” and that he acted “at the request of a lot of very good people.” Zhao was not charged with fraud, and his sentence was the first prison term for this kind of violation.</p>
  <p>In May 2025, Binance had accepted USD1, the stablecoin of the Trump family’s World Liberty Financial, as payment for a $2 billion investment by Abu Dhabi’s MGX, a major boost to the venture, while Zhao was seeking a pardon. Democrats called the pardon corrupt. Sen. Elizabeth Warren said Zhao “boosted one of Donald Trump’s crypto ventures and lobbied for a pardon. Today, Donald Trump did his part.” The White House denied any conflict of interest.</p>
  <p><strong>Why it matters:</strong> The pardon cleared the conviction of a figure whose company had done business benefiting the president’s family, a venture the Wall Street Journal estimated had added more than $5 billion in paper wealth to the Trumps. No investigation has found that the pardon was granted in exchange for that business.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Presidents have broad power to pardon federal crimes, and several have pardoned people with personal or financial ties to them: Bill Clinton pardoned the fugitive financier Marc Rich, whose former wife was a Democratic donor, in 2001, and Joe Biden pardoned his son and other relatives in 2024 and 2025. In 2025 Trump pardoned several crypto figures, including Silk Road founder Ross Ulbricht and the founders of the BitMEX exchange.</p>
</div>
<!-- END: historical-context -->

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Zhao “was prosecuted by the Biden Administration in their war on cryptocurrency,” and was pursued “despite no allegations of fraud or identifiable victims.”</p>
  <p><strong>Origin:</strong> White House press secretary Karoline Leavitt, statement of October 23, 2025.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Zhao was not charged with fraud, and his four-month term was the first prison sentence for this kind of violation. But the case was brought jointly by the Justice Department, the Treasury and financial regulators; Binance admitted failing to report or block transactions involving sanctioned groups, including Hamas and al Qaeda; and Zhao pleaded guilty, telling the court, “I failed here.”</p>

  <p><strong>Claim:</strong> “What he did is not even a crime.”</p>
  <p><strong>Origin:</strong> President Trump, October 23, 2025, describing what he said others had told him.</p>
  <p><strong>Verdict:</strong> ❌ False</p>
  <p><em>Rationale:</em> Willfully failing to maintain an effective anti-money-laundering program is a federal crime under the Bank Secrecy Act. Zhao pleaded guilty to it in 2023 and was sentenced to four months in prison.</p>

  <p><strong>Claim:</strong> Zhao “pleaded guilty to a money laundering charge.”</p>
  <p><strong>Origin:</strong> CNN and ABC News, October 23, 2025; similar wording by the Washington Examiner and MSNOW.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Zhao was not charged with money laundering. He pleaded guilty to failing to maintain an effective anti-money-laundering program, a Bank Secrecy Act violation, as Fox Business, the New York Post and Reuters reported.</p>

  <p><strong>Claim:</strong> Zhao “boosted one of Donald Trump’s crypto ventures and lobbied for a pardon. Today, Donald Trump did his part.”</p>
  <p><strong>Origin:</strong> Sen. Elizabeth Warren, October 23, 2025.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The sequence is on the record: Binance accepted World Liberty’s stablecoin for the $2 billion MGX investment, and Zhao sought a pardon. But “did his part” implies an exchange, and no investigation or document has shown that the pardon was granted in return for that business.</p>

</div>
<!-- END: fc-claims -->

<!-- BEGIN: hypocrisy -->
<div id="hypocrisy">
  <p><strong>Baseline (prior statement):</strong> For years Trump accused the Biden family of profiting from people seeking influence. In June 2023, at his New Jersey golf club, he vowed to “appoint a real special prosecutor to go after the most corrupt president in the history of America, Joe Biden,” and “go after the Biden crime family.” On January 20, 2025, he mocked Biden for pardoning “his whole family,” calling it an “unbelievable precedent.”</p>
  <p><strong>Follow-up (current case):</strong> On October 23, 2025, Trump pardoned Zhao, whose company had given a major boost to the Trump family’s crypto venture months earlier, saying he did so “at the request of a lot of very good people.”</p>
  <p><strong>Assessment:</strong> Severity 4 — A president who made the Biden family’s alleged profiting from influence a central charge then pardoned a man whose company had enriched his own family, a contradiction hard to reconcile. It falls short of a direct reversal: Trump made no pledge about his own pardons, said in January that Biden’s move gave him “precedent,” and no exchange of the pardon for the business has been shown.</p>
</div>
<!-- END: hypocrisy -->

function ncFrame(w,NC){NC.forEach(o=>w.append(E('div','vf','<span class="chip" style="background:'+col(o.class)+'">'+esc(o.outlet)+'</span> <span class="v" style="background:#6b7280">'+esc(ncK(o).row_label)+'</span><div class="sm">'+esc(ncK(o).frame_line||'No article, so there were no images to review.')+'</div>')));return w}
function methodCard(){const M=CONTRACT.methodology,W=CONTRACT.credibility,c=card('How this analysis works',E('div')),b=c.lastChild;
 b.append(E('p','',esc(M.intro)));
 const mt=E('div');Object.entries(CONTRACT.metrics).forEach(([k,v])=>{let h='<p><b>'+esc(v.label)+'</b></p><table><tbody>'+v.words.map((w,i)=>'<tr><td style="width:24%"><span class="v" style="background:'+hue(i)+';color:'+hueTxt(i)+'">'+esc(w)+'</span></td><td style="text-align:left">'+esc((M.metric_definitions[k]||{})[w]||'')+'</td></tr>').join('')+'</tbody></table>';mt.append(E('div','',h))});
 mt.append(E('p','note','Green is better and red is worse on every scale.'));Object.entries(CONTRACT.metrics).forEach(([k,v])=>{});b.append(det('What each rating word means',mt));
 const cw=W.weights,lab=W.weight_labels;let h='<p>Each outlet’s score out of 100 is calculated from its ratings, not judged separately. Better ratings earn more points, and each kind of rating counts for a set share of the total:</p><ul>'+Object.keys(cw).map(k=>'<li>'+esc(lab[k])+': '+cw[k]+'%</li>').join('')+'</ul><p>Images count fully when we saw them and half when we could only read the caption. Score bands: '+W.bands.map(x=>esc(x[0].replace(/^Below/,'below'))+' '+esc(x[1]).toLowerCase()).join('; ')+'.</p>';
 b.append(det('How the credibility score works',E('div','',h)));
 b.append(det('Fact-check verdicts',E('div','','<ul>'+Object.entries(M.verdict_definitions).map(([k,v])=>'<li><b>'+esc(k)+'</b>: '+esc(v)+'</li>').join('')+'</ul>')));
 b.append(det('What each outlet included',E('div','','<p>For each key fact, the grid shows whether an outlet included it, mentioned it briefly, left it out, or reported it later because the fact came out after its article. Leaving out a central or important fact lowers the Strategic Silence rating.</p><p>'+esc(M.not_covered)+'</p>')));
 b.append(det('The Bias Map',E('div','','<p>'+esc(M.bias_map)+'</p>')));
 b.append(det('Headlines and lead images',E('div','','<p>'+esc(M.imagery)+'</p><p>The image at the top of each analysis is public domain or openly licensed, or made for the analysis, and credited in its caption.</p>')));
 if(M.lean)b.append(det('How we measure tilt',E('div','','<p>'+esc(M.lean)+'</p>')));b.append(det('Sister sites, TV and video',E('div','','<p>'+esc(M.network)+'</p>')));if(M.placement)b.append(det('Homepage placement and labels',E('div','','<p>'+esc(M.placement)+'</p>')));b.append(det('When outlets run AP or Reuters articles',E('div','','<p>'+esc(M.wire_copy)+'</p>')));b.append(det('Checking our own bias',E('div','','<p>'+esc(M.mirror_test)+'</p>'+(M.blind_pass?'<p>'+esc(M.blind_pass)+'</p>':'')+'<p>We also compare each score with the outlet’s usual track record. When a score is unusually high or low, we recheck it, but this story’s articles decide.</p>')));
 if(/^https:\/\//.test(M.url||''))b.append(E('p','','<a href="'+esc(M.url)+'" target="_blank" rel="noopener noreferrer">'+esc(M.url_label)+'</a>'));
 return c}
function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
function render(src){const{b,rest}=parse(src),out=$('#out');out.innerHTML='';
 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}
 const D=runData(b);setRank(D);const el=id=>b[id]?clean(dom(b[id]).firstElementChild||dom(b[id])):null,tx=id=>el(id)?el(id).textContent.trim():'';
 const LB=(String(src).match(/<!--\s*LOOK BACK:\s*([\s\S]*?)\s*-->/)||[])[1];if(LB)out.append(E('div','lb','LOOK BACK'));out.append(E('h1','',esc(tx('headline')||'Untitled analysis')));if(tx('coverage-date'))out.append(E('p','date',LB?'Look Back · Coverage from '+esc(tx('coverage-date'))+' · Analyzed '+esc(LB):'Coverage as of '+esc(tx('coverage-date'))));
 const NC=(D.notCovered&&D.notCovered.outlets)||[];if(D.cred)out.append(E('div','chips',byRank(D.cred.scores).map(o=>'<span class="chip" style="background:'+col(o.class)+'"'+(wireTxt(o)?' title="'+esc(wireTxt(o))+'"':'')+'>'+esc(o.outlet)+(wireTxt(o)?' <small class="cw">· '+esc(o[CONTRACT.wire_copy.fields.source])+' text</small>':'')+(viaTxt(o)?' <small class="cw">· '+esc(viaTxt(o))+'</small>':'')+(typeTxt(o)?' <small class="cw">· '+esc(typeTxt(o))+'</small>':'')+'</span>').join('')+NC.map(o=>'<span class="chip nc" title="'+esc(ncK(o).status_label)+'">'+esc(o.outlet)+': '+esc(ncK(o).chip_suffix)+'</span>').join('')));
 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}
 if(el('nr-body')){const bc=card(ST['nr-body'],el('nr-body')),DL=CONTRACT.dropdown_labels;if(el('historical-context'))bc.append(det(DL['historical-context'],el('historical-context')));if(el('outlet-coverage')){const oc=el('outlet-coverage');((D.cred&&D.cred.scores)||[]).filter(o=>wireTxt(o)||viaTxt(o)||typeTxt(o)||placeOf(D,o)).forEach(o=>oc.querySelectorAll('li').forEach(li=>{const a=li.querySelector('a');if(a&&a.textContent.trim()===o.outlet)li.insertAdjacentHTML('beforeend',[wireTxt(o),viaTxt(o),typeTxt(o),placeOf(D,o)].filter(Boolean).map(t=>' <span class="tag wt2">'+esc(t)+'</span>').join(''))}));liRank(oc);if(D.placement&&D.placement.checked_at)oc.append(E('p','note','Homepages checked '+esc(D.placement.checked_at)+'. '+esc(CONTRACT.placement.note)));bc.append(det(DL['outlet-coverage'],ncOC(oc,NC)))}if(D.network&&D.network.outlets)bc.append(det(DL['network-coverage'],netList(D.network)));if(D.coverage&&D.coverage.facts){const nm={};((D.cm&&D.cm.rows)||[]).forEach(r=>nm[r.class]=r.outlet);D.coverage._nc=NC;bc.append(det(DL['coverage-grid'],covGrid(D.coverage,nm)))}out.append(bc)}else if(el('outlet-coverage'))out.append(card('Outlet Coverage',el('outlet-coverage')));
 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));
 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
