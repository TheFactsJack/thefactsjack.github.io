<div id="nr-body">
  <p>On October 21, Israeli soldiers and police detained Brad Lander, the Democratic nominee in New York’s 10th Congressional District, and dozens of volunteers who were helping Palestinian farmers harvest olives near the village of Nahalin, outside Bethlehem in the West Bank. Organizers put the number at about 80 to 90. Lander, a former New York City comptroller who won his primary in June, was released within hours “with a ‘warning,’” he wrote, “apparently because of my public profile”; Israel Police said he was released once it became known he was a congressional candidate. Police released more than 70 others that evening and moved to deport four foreign volunteers.</p>
  <p>Police said the group had entered an area near the Beitar Illit settlement that required approval, and the army called the activists’ arrival “an act intended solely to provoke.” Israel’s Foreign Ministry called the trip “a calculated political provocation,” wrote “This was not about harvesting olives. It was about harvesting headlines,” and said Lander’s team had been told in advance that coordination was required. Lander says Israel’s embassy in Washington had recommended coordination but did not say it was required.</p>
  <p>Lander said the group was detained “for harvesting olives” and that “Harvesting olives isn’t a crime under any law I know,” and he called the detentions part of “state-sponsored ethnic cleansing.” A Civil Administration map given to local farmers, published by the Times of Israel, shows the grove outside the area needing prior coordination; the army said the plot was unmarked because farmers had never asked to harvest it.</p>
  <p><strong>Why it matters:</strong> A nominee likely to enter Congress in January was detained by a close U.S. ally 13 days before the election, and the episode has become part of a wider Democratic argument over Israel. Israel’s own map bears directly on its stated reason for the detentions.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>The West Bank olive harvest, each October and November, has long been a point of friction between Palestinian farmers, Israeli settlers and the army, and Israeli and foreign volunteers have for years joined harvests as a protective presence. In 2026 the army expanded by nearly 30% the farmland Palestinians may enter only with prior coordination, according to the Israeli group Peace Now, and rights groups reported hundreds of thefts, clashes and arson attacks during the season. In July 2026, Rep. Ro Khanna was briefly detained in the West Bank. Lander himself was handcuffed by federal immigration agents at a Manhattan immigration court in June 2025, while escorting an immigrant, and released without charges.</p>
</div>

  <ul>
    <li><a href="https://www.foxnews.com/politics/mamdani-backed-congressional-candidate-detained-israeli-military">Fox</a>: Posted at 9:31 a.m. ET while Lander was still in custody and not updated, it relies on Lander’s post and the group’s, gives no Israeli position, and spends much of its length on his politics: his former DSA membership, his primary win, and another Mamdani-backed candidate’s run-in with New York police. In its own voice it calls the West Bank “disputed territory.” Fox ran no later article or video on his release or Israel’s statement in the window searched.</li>

    <li><a href="https://apnews.com/article/brad-lander-west-bank-olive-harvest-idf-detentions-6bacbd38793482469c12cb9dad764cfa">AP</a>: Leads with the detention and Lander’s release “hours later” while dozens stayed in custody, and gives the army’s position in the third paragraph. It sets the army’s coordination claim beside Peace Now figures showing the area needing approval grew by nearly 30% this year, and places the event in a harvest season rights groups call the most violent in recent years. It does not mention the Foreign Ministry’s statement or the Civil Administration map.</li>
    <li><a href="https://www.ms.now/news/new-york-democratic-candidate-brad-lander-released-after-being-detained-in-west-bank">MSNOW</a>: MSNOW’s own reporting (posted at 11:51 a.m., revised at 12:32 p.m. ET) leads with Lander’s release and quotes his “warning” post, his “state-sponsored ethnic cleansing” remark, the army’s coordination statement and Rabbis for Human Rights. It then turns to rising settler violence, Mamdani’s feud with Netanyahu and Trump’s endorsement of Netanyahu, with a live interview with Lander as its lead video. It does not include the Foreign Ministry’s statement or the map.</li>
    <li><a href="https://abcnews.com/International/congressional-candidate-brad-lander-detained-idf-west-bank/story?id=137447702">ABC News</a>: Published the next morning, it gives the most complete account: the stop and the buses, the army’s view that the activists came “solely to provoke,” the Foreign Ministry’s “stunt” post and its claim that Lander’s team was told to coordinate, the organizers’ reply that no one could have known of the order, and Lander’s answer that the ministry’s post had “multiple lies” and that maps showed the grove was not a closed zone. It reports the map point as Lander’s claim without checking it, and ends with Mamdani’s statement and a State Department comment.</li>
    <li><a href="https://nypost.com/2026/10/21/us-news/ny-congressional-nominee-brad-lander-says-he-was-detained-by-the-idf-in-the-west-bank/">New York Post</a>: Posted at 9:44 a.m. ET from Lander’s posts, it opens “Lefty congressional nominee Brad Lander claimed Wednesday he was “detained,”” describes him “glaring at the camera” and says it is “unclear” whether he was “doing anything else besides olive harvesting,” while quoting Rabbis for Human Rights confirming about 90 detentions. Its 4:38 p.m. follow-up is built entirely on the Foreign Ministry’s post, without his release, the organizers’ account or the map.</li>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Lander “deliberately entered a restricted security area” that required prior coordination.</p>
  <p><strong>Origin:</strong> Israel’s Foreign Ministry on X, October 21, 2026; Israel Police said the group entered an area near the fence of the Beitar Illit settlement that required approval.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Soldiers declared the grove a closed military zone once the group was there, according to the organizers, but a map Israel’s Civil Administration gave Palestinian farmers shows it outside the area that needed prior coordination. The army’s explanation, that the plot was unmarked because farmers had never asked to harvest it, does not show the group knew; no evidence offered supports “deliberately.”</p>

  <p><strong>Claim:</strong> Lander’s team was told in advance that coordination was required, and he ignored it.</p>
  <p><strong>Origin:</strong> Israel’s Foreign Ministry, October 21, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Both sides agree there was contact before the trip and differ on what was said: Lander says Israel’s embassy in Washington recommended coordinating with local authorities but did not say it was required. The ministry has released no record of the exchange, so the evidence is too thin to confirm either account.</p>

  <p><strong>Claim:</strong> The group was detained “for harvesting olives.”</p>
  <p><strong>Origin:</strong> Brad Lander, in a video from the bus, October 21, 2026 (“We’ve been detained by the Israeli military for harvesting olives”).</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Israeli authorities say the group was detained for harvesting in a closed area without the required coordination, which the army said posed a security risk, not for harvesting as such. Whether the grove needed coordination is disputed (see the first claim), but the stated grounds were the place, not the activity.</p>

  <p><strong>Claim:</strong> Lander was released because of his public profile.</p>
  <p><strong>Origin:</strong> Brad Lander on X, October 21, 2026 (“apparently because of my public profile”).</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Israel Police told AP that Lander was “released after it became known that he was a congressional candidate,” and an organizer said officers told him the same. Others detained with him were held for several more hours.</p>

  <p><strong>Claim:</strong> The trip was “a calculated political provocation” meant to harvest headlines rather than olives.</p>
  <p><strong>Origin:</strong> Israel’s Foreign Ministry; the army said the activists’ arrival was “an act intended solely to provoke.”</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Lander publicized the trip with videos before the detention, and the group came at the landowners’ invitation, according to the organizers. Neither fact establishes a motive, and the ministry offered no evidence of one; a talking-points memo reported by the Washington Free Beacon has not been authenticated.</p>

</div>
