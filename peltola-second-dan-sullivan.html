<div id="nr-body">
  <p>The New York Times reported on October 28 that aides to Mary Peltola, the Democratic nominee for Senate in Alaska, worked with campaign lawyers and staff of the Democratic Senatorial Campaign Committee to recruit spoiler candidates, including a retired Petersburg teacher named Dan J. Sullivan, to draw votes from Republican Sen. Dan S. Sullivan. The Times cited interviews, text messages and documents. Peltola’s former campaign manager, Elisa Rios, said Peltola was “definitely aware” of the effort but not directly involved.</p>
  <p>The campaign says it “has no involvement with either Sullivan campaign,” the DSCC denies involvement, and on October 29 Peltola said, “I knew nothing about any other candidate on the ballot except for me and the incumbent.” The second Sullivan has denied running at Democrats’ behest.</p>
  <p>President Trump called the effort “ELECTION FRAUD” and said Peltola should be prosecuted and removed from the ballot. Gov. Mike Dunleavy ordered a state investigation, and the Justice Department, which has sued to block certification if Sen. Sullivan loses narrowly, issued new subpoenas. Recruiting spoiler candidates is generally legal, and both parties’ allies have boosted lesser-known candidates in this race. In June, state election officials ruled the second Sullivan’s filing was meant to confuse voters; the Alaska Supreme Court reinstated him.</p>
  <p><strong>Why it matters:</strong> The race could decide control of the Senate on November 3, and more than 60,000 Alaskans had already voted. Federal and state officials are now investigating a candidate in the final days of a campaign over conduct that may not be illegal.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Alaska’s top-four primary and ranked-choice general election, adopted in 2020, let any candidate who gathers enough primary votes reach the November ballot, and super PACs on both sides spent more than $2 million this summer trying to lift lesser-known candidates. Same-name spoilers have a history elsewhere: in Florida’s 2020 state Senate race, a no-party candidate named Rodriguez drew votes from a Democratic incumbent also named Rodriguez, who lost by 32 votes, and a former Republican state senator, Frank Artiles, was later charged with paying him to run.</p>
</div>

<div id="fc-claims">

  <p><strong>Claim:</strong> Peltola’s side “found a man named Dan Sullivan, put him on the Ballot, then lied to the Court, and said they didn’t know anything about it. That’s perjury.”</p>
  <p><strong>Origin:</strong> President Trump on Truth Social, October 28, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> No court has found that anyone lied to it, and none of the coverage identifies a sworn statement by Peltola or her campaign that the Times’ reporting contradicts. The Times reported that campaign aides took part in the recruiting effort; whether anyone testified falsely about it has not been shown.</p>

  <p><strong>Claim:</strong> The effort was “ELECTION FRAUD,” and Peltola is “trying to steal a Senate seat.”</p>
  <p><strong>Origin:</strong> President Trump on Truth Social, October 28; Vice President JD Vance, October 29, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Recruiting spoiler candidates is generally legal, the Times noted, and election-law experts quoted by AP and CNN said the conduct described likely broke no law; the Alaska Supreme Court ruled that the second Sullivan could run. State and federal investigations are under way, but no charge or finding of fraud has been made.</p>

  <p><strong>Claim:</strong> Peltola’s aides worked with DSCC staff and campaign lawyers to recruit the second Dan Sullivan and other spoiler candidates, and Peltola was “definitely aware.”</p>
  <p><strong>Origin:</strong> The New York Times, October 28, 2026, citing interviews, text messages and documents, and Peltola’s former campaign manager, Elisa Rios, who was fired in August.</p>
  <p><strong>Verdict:</strong> ⚖️ Alleged</p>
  <p><em>Rationale:</em> The Times says its account rests on texts, documents and about a dozen sources, but those materials have not been made public, and Reuters and Alaska Public Media said they could not independently verify the report. Rios tried to retract her comments before publication, and Peltola’s campaign says it “did not recruit any candidates into the race,” the DSCC denies involvement, Peltola says she “knew nothing,” and the second Sullivan says he entered on his own; no investigation or court has reached a finding.</p>

</div>

function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}

 out.append(E('h1','',esc(tx('headline')||'Untitled analysis')));if(tx('coverage-date'))out.append(E('p','date','Coverage as of '+esc(tx('coverage-date'))));

 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}

 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));

 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
