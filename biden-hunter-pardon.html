<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>On December 1, 2024, President Joe Biden granted his son Hunter Biden a “full and unconditional” <a href="https://commons.wikimedia.org/wiki/File:2024-12-01_Biden_pardon_Hunter_Biden.jpg">pardon</a> for any federal offenses he “committed or may have committed” from January 1, 2014, through December 1, 2024, including the gun and tax cases brought by special counsel David Weiss. Hunter Biden had been convicted by a jury in June on three gun felonies and had pleaded guilty in September to nine tax charges over $1.4 million in unpaid taxes; he faced sentencing that month.</p>
  <p>Biden and the White House had said repeatedly that he would not pardon his son. In a statement, Biden said his son was “singled out only because he is my son” and that “raw politics has infected this process and it led to a miscarriage of justice.” Two federal judges had rejected Hunter Biden’s motions arguing he was selectively or vindictively prosecuted.</p>
  <p>Republicans criticized the pardon. President-elect Donald Trump asked whether it covered the “J-6 Hostages, who have now been imprisoned for years,” adding, “Such an abuse and miscarriage of Justice!” and Rep. James Comer said Biden had “lied from start to finish” about his family’s business dealings. House Republicans’ impeachment inquiry into those dealings had ended without an impeachment vote.</p>
  <p><strong>Why it matters:</strong> A president used his pardon power for his own son, reversing a public promise in his final weeks in office, and the pardon’s 10-year window reaches beyond the two cases. Other presidents have pardoned relatives and associates, and the pardon became a reference point in later debates over clemency.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>The Constitution gives presidents nearly unlimited power to pardon federal crimes. Bill Clinton pardoned his half-brother, Roger Clinton, on his last day in office in 2001, and Donald Trump in December 2020 pardoned Charles Kushner, the father of his son-in-law, along with former campaign aides convicted in the Mueller investigation. Gerald Ford’s 1974 pardon of Richard Nixon covered any offenses Nixon “committed or may have committed” over a span of years rather than specific charges, the same wording used in Hunter Biden’s pardon.</p>
</div>
<!-- END: historical-context -->

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Hunter Biden was “singled out only because he is my son” and was “selectively, and unfairly, prosecuted.”</p>
  <p><strong>Origin:</strong> President Biden, statement of December 1, 2024.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Two federal judges, in Delaware and California, rejected Hunter Biden’s motions arguing selective or vindictive prosecution, a jury convicted him on the gun charges, and he pleaded guilty to the tax charges. Biden’s points that gun-form charges alone are rarely brought and that a plea deal had collapsed are on the record, but no court found that he was charged because of his father.</p>

  <p><strong>Claim:</strong> “Joe Biden has lied from start to finish about his family’s corrupt influence peddling activities.”</p>
  <p><strong>Origin:</strong> Rep. James Comer, chair of the House Oversight Committee, December 1, 2024.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Testimony and photos show Biden met or spoke by phone with some of his son’s business associates, which is at odds with his statements that he never discussed the business. But House Republicans’ impeachment inquiry did not show that Biden profited from the dealings or took official action for them, and it ended without an impeachment vote.</p>

  <p><strong>Claim:</strong> The pardon covers Hunter Biden’s foreign business dealings, not just the gun and tax cases.</p>
  <p><strong>Origin:</strong> CNN, which wrote that its time frame “importantly” covers his years on the Burisma board; echoed by the New York Post and the Washington Examiner.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> The <a href="https://commons.wikimedia.org/wiki/File:2024-12-01_Biden_pardon_Hunter_Biden.jpg">grant</a> covers offenses he “committed or may have committed or taken part in” from January 1, 2014, through December 1, 2024, “including but not limited to” the two cases, a span that includes his Burisma and China work. It covers federal offenses only, and no charges had been brought over those dealings.</p>

</div>
<!-- END: fc-claims -->

<!-- BEGIN: hypocrisy -->
<div id="hypocrisy">
  <p><strong>Baseline (prior statement):</strong> In a June 2024 interview with ABC News, asked whether he would rule out pardoning his son, Biden said “Yes,” and said, “I will not pardon him.” The White House repeated the position after his son’s convictions, and in November 2024 the press secretary said, “Our answer stands, which is no.”</p>
  <p><strong>Follow-up (current case):</strong> On December 1, 2024, Biden said, “Today, I signed a pardon for my son Hunter,” granting a full and unconditional pardon covering 10 years of possible federal offenses.</p>
  <p><strong>Assessment:</strong> Severity 5 — A direct reversal of a public, repeated pledge. Biden’s explanation, that his son was singled out by “raw politics,” rests on a claim two federal judges rejected; he noted that he had kept his separate promise not to interfere in the Justice Department’s decisions.</p>
</div>

function methodCard(){const M=CONTRACT.methodology,W=CONTRACT.credibility,c=card('How this analysis works',E('div')),b=c.lastChild;
 b.append(E('p','',esc(M.intro)));

 mt.append(E('p','note','Green is better and red is worse on every scale.'));Object.entries(CONTRACT.metrics).forEach(([k,v])=>{});b.append(det('What each rating word means',mt));
 const cw=W.weights,lab=W.weight_labels;let h='<p>Each outlet’s score out of 100 is calculated from its ratings, not judged separately. Better ratings earn more points, and each kind of rating counts for a set share of the total:</p><ul>'+Object.keys(cw).map(k=>'<li>'+esc(lab[k])+': '+cw[k]+'%</li>').join('')+'</ul><p>Images count fully when we saw them and half when we could only read the caption. Score bands: '+W.bands.map(x=>esc(x[0].replace(/^Below/,'below'))+' '+esc(x[1]).toLowerCase()).join('; ')+'.</p>';
 b.append(det('How the credibility score works',E('div','',h)));

 b.append(det('What each outlet included',E('div','','<p>For each key fact, the grid shows whether an outlet included it, mentioned it briefly, left it out, or reported it later because the fact came out after its article. Leaving out a central or important fact lowers the Strategic Silence rating.</p><p>'+esc(M.not_covered)+'</p>')));

 if(M.lean)b.append(det('How we measure tilt',E('div','','<p>'+esc(M.lean)+'</p>')));b.append(det('Sister sites, TV and video',E('div','','<p>'+esc(M.network)+'</p>')));if(M.placement)b.append(det('Homepage placement and labels',E('div','','<p>'+esc(M.placement)+'</p>')));b.append(det('When outlets run AP or Reuters articles',E('div','','<p>'+esc(M.wire_copy)+'</p>')));b.append(det('Checking our own bias',E('div','','<p>'+esc(M.mirror_test)+'</p>'+(M.blind_pass?'<p>'+esc(M.blind_pass)+'</p>':'')+'<p>We also compare each score with the outlet’s usual track record. When a score is unusually high or low, we recheck it, but this story’s articles decide.</p>')));

function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};

 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?'Current — '+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
