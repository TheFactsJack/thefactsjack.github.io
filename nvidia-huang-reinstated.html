<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>Nvidia’s board unanimously reinstated Jensen Huang as president and chief executive on November 23, 11 days after he resigned over extramarital affairs, including one with Alice Huang, a businesswoman U.S. officials suspect of working for Chinese intelligence. Days earlier, board chair Harvey Jones had ruled out his return, saying his behavior was inconsistent with the company’s code of conduct. The board said input from senior U.S. officials left it confident his return “poses no national security risk.” President Trump told CNBC, “I believe my intervention was very important,” and relayed that Attorney General Todd Blanche had confirmed the government “does not possess evidence that he has engaged in any unlawful conduct.” That night, asked on Fox News whether Huang was cleared, Blanche replied: “That assumes there is an investigation that’s open.” Earlier in November he said the department had reached no conclusion on whether Alice Huang was a spy.</p>
  <p>Nvidia’s shares closed up 31.5%, adding nearly $1 trillion. Trump owns $11 million to $55 million in Nvidia stock, per a Reuters review; the White House says his portfolio is managed independently. Lawmakers of both parties objected, including Senate Democratic leader Chuck Schumer and Republican Sens. John Cornyn and Pete Ricketts. Huang faces House committees on December 1 and a public Senate hearing on December 3, and the U.S. blacklisted Megaspeed, Alice Huang’s former employer, the same day.</p>
  <p><strong>Why it matters:</strong> A president said openly that he helped persuade the board of a company central to American export controls on AI chips, in which he holds shares, to restore its chief executive, and the board’s stated reason moved from Huang’s conduct to the administration’s security assurances. Asked whether Huang had been cleared, Attorney General Todd Blanche, whose assurance the president cited, would not answer. The congressional hearings will be the first public test of those assurances.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Presidents have shaped corporate leadership before, usually with direct financial leverage. In March 2009 the Obama administration’s auto task force asked General Motors chief Rick Wagoner to step down as a condition of further federal aid, and he resigned; the government had replaced the chiefs of AIG, Fannie Mae and Freddie Mac when it rescued them in 2008. Nvidia has received no federal rescue. Boards rarely reverse a chief executive’s departure; the best-known recent case is OpenAI’s reinstatement of Sam Altman in 2023, days after its board fired him, under pressure from investors and employees.</p>
</div>
<!-- END: historical-context -->

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.reuters.com/technology/nvidia-reinstates-jensen-huang-ceo-2026-11-23/">Reuters</a>: Its headline and first sentence say Huang returned “under pressure from” Trump. It reports that the chair had ruled out his return less than a week earlier, that governance experts questioned the board’s independence, and the 31.5% share jump. It quotes Trump (“I believe my intervention was very important”), and its own review found he owns $11 million to $55 million in Nvidia stock, with the White House saying his portfolio is managed independently. It quotes critics from both parties, including Schumer and Sen. Pete Ricketts (R), and covers the affairs, Huang’s apology, the December 3 Senate hearing, the blacklisting of Alice Huang’s former employer and the open investigations.</li>
    <li><a href="https://apnews.com/article/nvidia-jensen-huang-39d4b34ffaa867b4e669893b5fd5028f">AP</a>: Its first sentence says the board acted “apparently at the behest of” Trump, days after rejecting Huang’s offer to return, following his admitted affair with a woman suspected of being a Chinese spy. It quotes Trump (“The board decided to do what we wanted them to do”), reports that Vice President Vance acted as an emissary, that Trump said market declines “probably” affected his thinking, and that he posted a fake image of Huang holding a red bra. It relays Blanche’s statement through Trump and notes that the Justice Department had not concluded whether Alice Huang is a spy. It quotes Schumer and two governance critics, and reports the coming House interview and the 31% share rise. It does not mention Trump’s Nvidia holdings.</li>
    <li><a href="https://www.foxbusiness.com/markets/nvidia-reinstates-jensen-huang-ceo">Fox</a>: Fox’s main article ran on Fox Business. Its headline says the board acted “following US government input,” and it reports the unanimous vote, the board’s and Huang’s statements, a new national security committee and an investigation into “recent reports that Huang was the target of a foreign intelligence effort.” It quotes Trump’s Truth Social posts in full (“Great Patriot and National Treasure”) and his CNBC remark that Huang “did nothing wrong.” It does not mention the affairs or why Huang resigned, the board’s earlier refusal, Trump’s own account of intervening, his Nvidia holdings, any critic, the congressional hearings or the share jump. Fox News ran separate articles that day on criticism of Trump’s role.</li>
    <li><a href="https://nypost.com/2026/11/23/business/nvidia-reinstates-jensen-huang-as-ceo-weeks-after-shocking-exit-over-chinese-spy-affair-scandals/">New York Post</a>: Its headline leads with the “Chinese spy, affair scandals,” and it calls the return a “stunning reversal” that sent shares up 34% in early trading. It reports the unanimous vote and statements, quotes Trump’s Truth Social post, and cites Bloomberg that the decision followed “pressure from President Trump.” It summarizes the Times’ reporting on Alice Huang and Megaspeed, notes that Trump was briefed in 2025 but has questioned whether she was a spy, and reports the relationship with an executive who reported to Huang. It quotes an analyst who backed the move. It does not quote any critic, mention the board’s earlier refusal or Trump’s Nvidia holdings, and mentions next week’s congressional testimony only in a link.</li>
    <li><a href="https://www.washingtonexaminer.com/policy/technology/4812128/nvidia-reinstates-jensen-huang-president-ceo/">Washington Examiner</a>: Reports the reinstatement less than two weeks after Huang was ousted over an affair with a suspected Chinese spy. In its own voice it says the board became confident of no security risk after Trump, industry leaders and employees “advocated his return, as Alice Huang was not a confirmed spy,” and that Elon Musk “celebrated Huang’s redemption.” It prints the company’s statement, Trump’s Truth Social post and Huang’s statement, and notes the interim chief had said Nvidia would not bring him back. It does not report Trump’s account of intervening, his Nvidia holdings, any critic or the congressional hearings. The Examiner ran separate articles that day on Republican and Democratic objections.</li>
    <li><a href="https://www.nbcnews.com/tech/tech-news/nvidia-reinstates-jensen-huang-rcna610864">NBC News</a>: Its headline says Huang was reinstated “after Trump pushes board,” and it reports that Trump confirmed he spoke with the board “directly and indirectly,” calling that in its own voice “a highly unusual step for an American president.” It gives the chair’s refusal days earlier, the affairs, including one with a direct report, Huang’s memo, the 31% share jump and a Justice Department official’s statement that there was no evidence of wrongdoing by Huang or Nvidia. It quotes Sen. John Cornyn (R) (“No national security risk? Based on what?”) and Sen. Elizabeth Warren (D), and lists the House and Senate hearings. It does not mention Trump’s Nvidia holdings.</li>
    <li><a href="https://www.cnn.com/2026/11/23/politics/trump-administration-jensen-huang-reinstated">CNN</a>: An account, from unnamed sources, of what it calls an “unprecedented West Wing pressure campaign”: Trump, worried by the stock market’s slide, had Vice President Vance lead weekend calls assuring the board that Huang posed no security risk. It quotes Trump (“I’ve been speaking to the board directly and indirectly”), reports the board’s refusal days earlier, that Blanche found no evidence of wrongdoing but later would not say Huang was cleared, Secretary of State Rubio’s earlier warnings, and that Megaspeed was being blacklisted. It quotes Sen. Pete Ricketts (R). It does not give Trump’s Nvidia holdings or the share jump. Its live blog that day noted his portfolio has had “millions invested” in Nvidia.</li>
    <li><a href="https://www.ms.now/news/nvidia-board-reinstates-jensen-huang-as-ceo">MSNOW</a>: Its first sentence says the board acted after Trump spoke “directly” with its members, and it quotes him: “And I convinced them.” It reports that Vance, Bessent and Lutnick were involved, adds in its own voice that tech billionaires “helped fund” Vance’s “path to power,” and quotes Trump saying the affairs drew attention because “sex sells.” It covers the Times report that Rubio warned of Alice Huang last spring and Trump’s denial, the fake image Trump posted, and an official saying the Justice Department got no heads-up and its Megaspeed probe continues. It quotes Republicans Cornyn and Bacon and Democrat Jeanne Shaheen, notes the chair had ruled out Huang’s return the week before, and reports the December 3 hearing. It does not mention Trump’s Nvidia holdings.</li>

<div id="fc-claims">

  <p><strong>Claim:</strong> Huang “did nothing wrong.”</p>
  <p><strong>Origin:</strong> President Trump, CNBC interview, November 23, 2026, as reported by NBC News and Fox Business.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> A Justice Department official told NBC News there was no evidence of wrongdoing by Huang or Nvidia, and Trump relayed the same from Attorney General Todd Blanche. But days earlier Nvidia’s own board chair said Huang’s conduct was inconsistent with the company’s code of conduct, Huang acknowledged being unfaithful and apologized, the board’s inquiry into whether foreign intelligence targeted him is unfinished, and Blanche declined on Fox News to say Huang had been cleared.</p>

  <p><strong>Claim:</strong> “Huang’s reinstatement poses no national security risk.”</p>
  <p><strong>Origin:</strong> Nvidia’s board, citing input from the U.S. government, November 23, 2026; repeated by Trump.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Neither the company nor the administration has said what the assessment rests on, and Sen. John Cornyn (R) asked, “Based on what?” The Justice Department had said it had not concluded whether Alice Huang is a spy, and its investigation of Megaspeed continues. The board itself formed a committee to examine whether foreign intelligence targeted Huang.</p>

  <p><strong>Claim:</strong> Trump is “putting his own financial interests … before our national security.”</p>
  <p><strong>Origin:</strong> Senate Democratic leader Chuck Schumer, as quoted by Reuters, November 23, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Trump owns $11 million to $55 million in Nvidia stock, according to a Reuters review, and the shares rose 31.5% on the news. But no evidence shows his holdings motivated the intervention. The White House says his portfolio is managed independently, and Trump cited the economy and the markets, which he said “probably” affected his thinking.</p>

function drift(D,plain){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};

 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band=(plain?'':'Severity '+sev+': ')+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?(i===P.length-1?'Current — ':'Earlier — ')+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
