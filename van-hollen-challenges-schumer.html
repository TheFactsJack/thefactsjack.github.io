<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>Eight days after Democrats won control of the Senate, Sen. Chris Van Hollen of Maryland announced on November 12 that he will challenge Sen. Chuck Schumer for Democratic leader. Voters “called for change,” he said, and “to do that we need new leadership.” His specific charges: Schumer and the party’s Senate campaign arm sided against two of the new senators in their primaries, and Schumer has not committed to using the December 11 funding deadline to force an end to the Iran war.</p>
  <p>Schumer, who has led Senate Democrats since 2017, answered that “55 seats and counting is an amazing result” and “I have the votes.” Sen. Bernie Sanders and Sen.-elect Abdul El-Sayed back Van Hollen; senators including Angus King, Kirsten Gillibrand and Brian Schatz back Schumer. Several others, among them Elissa Slotkin and four senators-elect, say they want new leadership or a different plan. Van Hollen, who days earlier said the job was “not my focus,” calls himself the underdog.</p>
  <p>The public split matters because the leader sets the majority’s strategy, and the first test comes fast: government funding runs out December 11, and Van Hollen and three other senators want to use that bill to cut off money for the war with Iran. Schumer’s camp argues he recruited and funded many of the candidates who won the majority. Van Hollen’s camp argues the election was a call for change, including at the top of the party.</p>
  <p><strong>Why it matters:</strong> The vote, by secret ballot in early December, decides who leads the new majority through Trump’s final two years. It is also the first real test of whether the party’s progressive wing can turn election wins into power inside the Senate.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Contested races for Senate party leader are rare. The last for Senate Democrats was in 1994, when Tom Daschle beat Chris Dodd by one vote. The last for Senate Republicans was in November 2022, when Rick Scott challenged Mitch McConnell after a disappointing midterm; McConnell won 37 to 10. Leaders are chosen by secret ballot, so public endorsements are an imperfect guide.</p>
</div>
<!-- END: historical-context -->

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.foxnews.com/politics/van-hollen-challenges-schumer-senate-leadership-after-democratic-election-sweep">Fox</a>: Calls Van Hollen “a progressive darling and outlet for those against Schumer’s bid” who has “occupied Schumer’s left flank,” and its subhead leads with his charge that Schumer “chose the crypto industry and AIPAC over progressive candidates.” It quotes his statement, Sen.-elect Abdul El-Sayed’s endorsement, Schumer’s reply (“I have the votes”) and Sen. Brian Schatz backing Schumer. It gives the two men’s ages and tenure. It does not report which other senators have declined to back Schumer, when or how the vote happens, or that Schumer backed El-Sayed’s primary rival.</li>
    <li><a href="https://www.washingtonexaminer.com/news/senate/4802382/chris-van-hollen-schumer-senate-majority-leader/">Washington Examiner</a>: Opens with the challenge “as a growing chorus of Senate Democrats calls for a new face,” quoting Van Hollen’s post about voters wanting to “unrig an economy rigged against working people.” It gives his clearest policy contrast: Schumer “hasn’t taken a position” on using the December 11 funding deadline to end the Iran war, and Democrats should not wait until January. It quotes Schumer’s reply and Schatz’s backing and explains the secret-ballot vote. It leaves out Van Hollen’s other backers and Schumer’s, his primaries charge, and his shift from saying days earlier the job was not his focus.</li>
    <li><a href="https://www.reuters.com/world/us/chris-van-hollen-announces-run-us-senate-majority-leader-challenging-schumer-2026-11-13/">Reuters</a>: Reports the challenge and Van Hollen’s statement, his “more than 10” supporters and his admission he is the “underdog,” and his platform: accountability for Trump’s “gross corruption,” ending “the U.S.-Israeli war on Iran” and an economic agenda for working people. It notes his criticism of Israel’s conduct in Gaza. It says Schumer “is expected to retain” the post “but previously predicted not having a challenger,” and quotes his reply. It quotes Van Hollen’s backers but no senator backing Schumer.</li>
    <li><a href="https://apnews.com/article/van-hollen-schumer-senate-democratic-leader-6d74c189cb6c065c9a810a1cf1a53436">AP</a>: Reports the challenge, Van Hollen’s statement and Schumer’s reply, and says it will be “the first contested election for Senate Democratic leader in decades,” by secret ballot in early December. It explains why the caucus is torn: “Schumer recruited many of the party’s winning candidates and raised money for them, but progressive groups are pushing for his removal.” It quotes backers on both sides (El-Sayed and Sanders; Angus King, Catherine Cortez Masto, Sherrod Brown) and notes Van Hollen, 67, is “not that much younger” than Schumer, 75.</li>
    <li><a href="https://www.cnn.com/2026/11/12/politics/chris-van-hollen-chuck-schumer-senate-democratic-leader">CNN</a>: Calls the bid “an uphill battle” and reports the vote is set for December 1. It sets out the differences: Van Hollen would use the Senate’s “full power” to end the Iran war and would stay out of open primaries, and it checks his primaries charge (Rep. Haley Stevens had Schumer’s “quiet backing” against El-Sayed). It notes Van Hollen told CNN days earlier the job was “not my focus.” It quotes Sanders, the senators-elect seeking new leadership, and Schumer’s backers (King, Ruben Gallego, Kirsten Gillibrand). Sen.-elect Scott Colom says it is “not accurate” that Schumer recruited him.</li>
    <li><a href="https://www.ms.now/news/van-hollen-schumer-senate-majority-leader">MSNOW</a>: Van Hollen announced his run on MSNOW’s own program, and the article reports the interview: voters rejected Trump “and his corruption and his wars and his cruelty” but have “not yet hired Democrats.” It weighs his weaknesses (“an uphill battle,” never in the top leadership posts, no sharp policy contrast with Schumer beyond primaries, a recent shift from showing little interest) and Schumer’s strengths (fundraising, recruiting many winners). It lists six caucus members, including four senators-elect, who signal they won’t back Schumer and notes the secret ballot lets senators break with him privately.</li>
    <li><a href="https://www.nbcnews.com/politics/congress/sen-chris-van-hollen-says-will-challenge-sen-chuck-schumer-majority-le-rcna609100">NBC News</a>: Reports the challenge as “likely to be the most serious challenge” Schumer has faced, though he “remains favored.” It quotes Van Hollen’s statement and interview (“more than 10” senators, “underdog,” “change or … the status quo”) and lays out his platform from his team: use every tool to end the Iran war, starting with the December funding bill; reverse Trump’s “big, beautiful bill”; and fight corruption. It quotes Sanders and El-Sayed for Van Hollen and King and Gillibrand for Schumer. It leaves out his primaries charge and his shift from days earlier.</li>
    <li><a href="https://nypost.com/2026/11/12/us-news/chris-van-hollen-challenging-schumer-for-senate-majority-leader/">New York Post</a>: Its headline calls him a “Lefty Democrat,” and its first sentence notes he announced “days after saying that he was ‘not looking’ to do so.” It quotes his statement and his interview (“Am I the underdog? Yes,” and Schumer “uses the power of incumbency to … provide deals”), Schumer’s reply, and backers on both sides, including Slotkin’s condition of a “concrete plan.” It adds that the last contested Senate Democratic leader race was in 1994 and that he shelved a 2028 run. It does not report his specific charges about primaries or the Iran war.</li>
  </ul>

<div id="fc-claims">

  <p><strong>Claim:</strong> “I have the votes to continue serving as Democratic Leader.”</p>
  <p><strong>Origin:</strong> Sen. Chuck Schumer on X, November 12, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> The vote is a secret ballot, and Schumer has not named a majority. Fewer than half the caucus has publicly backed him, and senators can vote differently in private.</p>

  <p><strong>Claim:</strong> More than 10 senators have pledged to support Van Hollen.</p>
  <p><strong>Origin:</strong> Sen. Chris Van Hollen on MSNOW, November 12, 2026.</p>
  <p><strong>Verdict:</strong> ❓ Unsupported</p>
  <p><em>Rationale:</em> Van Hollen named no supporters beyond those already public. Only Sen. Bernie Sanders and Sen.-elect Abdul El-Sayed have endorsed him openly.</p>

  <p><strong>Claim:</strong> “We have two members in that room, newly elected senators, who would not be there if Schumer and the DSCC had had their way. (They) sided with the crypto industry and AIPAC against these candidates.”</p>
  <p><strong>Origin:</strong> Sen. Chris Van Hollen, Democratic post-election conference, November 10, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Schumer did back Haley Stevens over El-Sayed in Michigan and first recruited Maine’s governor, Janet Mills, over Troy Jackson, who won. But no public record shows Schumer acting for the crypto industry or AIPAC, and the party’s campaign arm backed every nominee once chosen, including both men.</p>

  <p><strong>Claim:</strong> The wins in South Carolina and Mississippi “wasn’t orchestrated from Washington, D.C., or the DSCC — it was a people-powered movement.”</p>
  <p><strong>Origin:</strong> Sen. Chris Van Hollen on MSNOW, November 12, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Local organizing mattered, and Mississippi’s Scott Colom says Schumer did not recruit him. But the national party took part: Sen. Kirsten Gillibrand, who chairs the party’s Senate campaign committee, says it paid to register about 100,000 new voters in Mississippi.</p>

  <p><strong>Claim:</strong> On using the December 11 funding deadline to end the Iran war, Schumer “hasn’t taken a position.”</p>
  <p><strong>Origin:</strong> Sen. Chris Van Hollen on MSNOW, November 12, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> As of November 12, party leaders “have yet to decide” whether to risk a shutdown over war funding, The Hill reported, while Van Hollen and three other senators said they would oppose any stopgap without war limits. Schumer’s plan for the new majority includes efforts to stop the war, but he has not committed to the December tactic.</p>

function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?(i===P.length-1?'Current — ':'Earlier — ')+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
function render(src){const{b,rest}=parse(src),out=$('#out');out.innerHTML='';
 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}
 const D=runData(b);setRank(D);const el=id=>b[id]?clean(dom(b[id]).firstElementChild||dom(b[id])):null,tx=id=>el(id)?el(id).textContent.trim():'';

 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}
 if(el('nr-body')){const bc=card(ST['nr-body'],el('nr-body')),DL=CONTRACT.dropdown_labels;if(el('historical-context'))bc.append(det(DL['historical-context'],el('historical-context')));if(el('outlet-coverage')){const oc=el('outlet-coverage');((D.cred&&D.cred.scores)||[]).filter(o=>wireTxt(o)||viaTxt(o)||typeTxt(o)||placeOf(D,o)).forEach(o=>oc.querySelectorAll('li').forEach(li=>{const a=li.querySelector('a');if(a&&a.textContent.trim()===o.outlet)li.insertAdjacentHTML('beforeend',[wireTxt(o),viaTxt(o),typeTxt(o),placeOf(D,o)].filter(Boolean).map(t=>' <span class="tag wt2">'+esc(t)+'</span>').join(''))}));liRank(oc);if(D.placement&&D.placement.checked_at)oc.append(E('p','note','Homepages checked '+esc(D.placement.checked_at)+'. '+esc(CONTRACT.placement.note)));bc.append(det(DL['outlet-coverage'],ncOC(oc,NC)))}if(D.network&&D.network.outlets)bc.append(det(DL['network-coverage'],netList(D.network)));if(D.coverage&&D.coverage.facts){const nm={};((D.cm&&D.cm.rows)||[]).forEach(r=>nm[r.class]=r.outlet);D.coverage._nc=NC;bc.append(det(DL['coverage-grid'],covGrid(D.coverage,nm)))}out.append(bc)}else if(el('outlet-coverage'))out.append(card('Outlet Coverage',el('outlet-coverage')));
 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('🤔 Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));
 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
