<div id="nr-body">
  <p>On Saturday, November 14, Homeland Security Secretary Markwayne Mullin flew on a government plane to Baton Rouge, Louisiana, for the LSU-Texas football game. The trip came the day after the FAA’s nationwide ground stop, which halted departures for more than four hours on Friday and left thousands of travelers rebooking canceled flights through the weekend. Mullin had briefed reporters on the outage at the White House the evening before. The New York Post, which broke the story, reported that he watched from the private box of Ben Bordelon, CEO of Bollinger Shipyards, which is building four icebreaking cutters for the Coast Guard under a contract worth about $2.2 billion.</p>
  <p>DHS said federal law requires Mullin to fly on government planes so he can stay on secure communications, that he pays for personal trips himself, and that he follows all ethics rules. On CNBC on November 17, Mullin said airspace had been “completely open for 21 hours,” that he got the tickets from House Majority Leader Steve Scalise and paid fair market value, that he had never met Bordelon, and that he went so his great-niece could see her first LSU game: “We still got to live our lives.” At a House hearing the next day, Rep. Bennie Thompson, the committee’s top Democrat, pressed him on the trip, and Mullin called the criticism “hypocrisy.”</p>
  <p><strong>Why it matters:</strong> Mullin was one of the administration’s main voices on the outage, and the trip drew criticism from Democrats and from some conservative commentators. It also raises questions that are still open: what he repaid for the flight, and how close his contacts with a major department contractor should be.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Cabinet members’ use of government planes has drawn scrutiny under both parties. In 2017 Health and Human Services Secretary Tom Price resigned after reports on his use of private charter flights. In 2023 the Transportation Department’s inspector general reviewed Secretary Pete Buttigieg’s flights on FAA jets after Republican complaints, and found in December 2023 that they complied with federal rules. Under those rules, officials who must fly government planes for security reasons repay personal trips at the price of a coach ticket.</p>
</div>

  <ul>

<!-- BEGIN: fc-claims -->
<div id="fc-claims">

  <p><strong>Claim:</strong> Airspace had been “completely open for 21 hours” when he flew.</p>
  <p><strong>Origin:</strong> Homeland Security Secretary Markwayne Mullin on CNBC, November 17, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> The ground stop ended about 8:15 p.m. Eastern on Friday, and a Coast Guard jet landed in Baton Rouge on Saturday night, so the airspace had reopened about a day earlier. Airlines were still clearing cancellations that weekend, which “completely open” does not address.</p>

  <p><strong>Claim:</strong> “Secretary Mullin is required by law to travel on a government airplane.”</p>
  <p><strong>Origin:</strong> DHS spokesperson, November 17, 2026.</p>
  <p><strong>Verdict:</strong> ✅ True</p>
  <p><em>Rationale:</em> Federal travel rules let agencies require top officials with round-the-clock security or communications needs to fly government aircraft, including on personal trips. The requirement comes from executive-branch rules (OMB Circular A-126) rather than a law naming the secretary.</p>

  <p><strong>Claim:</strong> “Any flight not related to his service as DHS Secretary he pays for personally.”</p>
  <p><strong>Origin:</strong> DHS spokesperson, November 17, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> Under federal rules, personal trips on government planes are repaid at the price of a coach ticket, not the cost of running the jet. DHS has not said how much Mullin paid.</p>

  <p><strong>Claim:</strong> Bollinger’s contract was awarded before Mullin became secretary.</p>
  <p><strong>Origin:</strong> Homeland Security Secretary Markwayne Mullin on CNBC, November 17, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The Coast Guard first awarded the icebreaker contracts in December 2025, before Mullin took office in March. They were finalized in July 2026, under his department.</p>

  <p><strong>Claim:</strong> “During a national disaster, Markwayne Mullin chose to fly to Louisiana to watch a football game with someone who has a $2 billion DHS contract.”</p>
  <p><strong>Origin:</strong> Unnamed critic quoted by the New York Post, November 17, 2026.</p>
  <p><strong>Verdict:</strong> ⚠️ Misleading</p>
  <p><em>Rationale:</em> The contract is real and worth about $2.2 billion. But the ground stop had ended about a day before he flew, and no disaster was declared, though travel disruptions continued.</p>

</div>

function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?(i===P.length-1?'Current — ':'Earlier — ')+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}

 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}

 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
