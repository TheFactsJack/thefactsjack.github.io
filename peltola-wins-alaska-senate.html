<!-- BEGIN: nr-body -->
<div id="nr-body">
  <p>The Associated Press called Alaska’s Senate race for Democrat Mary Peltola late on November 17, two weeks after Election Day. With nearly all ballots counted, she had 50.1% of first-choice votes to Republican Sen. Dan Sullivan’s 45.8%, enough to win without ranked-choice tabulation. The win gives Democrats a 56-44 Senate majority, their ninth flipped seat of the midterms, and makes Peltola, who is Yup’ik, the first Alaska Native in the Senate. She said voters had sent a message that “the status quo in D.C. is not working for Alaska.” Sullivan, who did not comment on the call, had said his campaign would let the process “run its course until every legal vote is counted and certified.”</p>
  <p>The race’s final weeks were dominated by a dispute over a second candidate named Dan Sullivan, a retired teacher. Days before the election, The New York Times reported that Peltola campaign aides and national Democrats had recruited him to draw votes from the senator; Peltola, the party’s Senate campaign committee and the second Sullivan denied it, and the former campaign manager quoted in the report later sought to recant. A Justice Department criminal investigation and a state investigation remain open, with no charges. A federal judge dismissed the department’s suit to block certification, and the department appealed. The second Sullivan received about 1.7% of the vote, less than Peltola’s margin.</p>
  <p><strong>Update, November 19:</strong> The Justice Department asked the appeals court to dismiss its suit as moot, saying it “reluctantly acknowledges” there is no way to tell whether votes for the second Sullivan were meant for the senator, and Alaska’s elections director said the state plans to certify the result.</p>
  <p><strong>Why it matters:</strong> Alaska completes the largest Democratic Senate majority since 2009. The criminal and state investigations remain open, so questions about how the race was run are not settled.</p>
</div>
<!-- END: nr-body -->

<!-- BEGIN: historical-context -->
<div id="historical-context">
  <p>Peltola is the fifth Democrat to represent Alaska in the Senate since statehood and the first since Mark Begich, whom Sullivan defeated in 2014. Alaska adopted top-four primaries and ranked-choice general elections in 2020; in 2022 Peltola won the state’s House seat under that system, becoming the first Alaska Native in Congress, before losing it in 2024. Two years ago the same kind of upset ran the other way: Republican Tim Sheehy unseated Democratic Sen. Jon Tester in Montana, a state Trump won easily.</p>
</div>
<!-- END: historical-context -->

<div id="outlet-coverage">
  <ul>
    <li><a href="https://www.reuters.com/world/us/democrat-peltola-wins-alaska-securing-56-44-us-senate-majority-2026-11-18/">Reuters</a>: Reports the win, the 56-44 majority and that Peltola cleared 50% of first-place votes, avoiding further ranked-choice rounds. It notes she will be the first Alaska Native elected to the Senate, quotes her statement and Chuck Schumer’s, and explains why the count took two weeks. It covers the second-Sullivan dispute: the Times report, the campaign’s denial, the state and federal investigations, and Attorney General Todd Blanche calling the effort “fraud.” It does not mention that the Justice Department’s suit to block certification was dismissed, that the second Sullivan’s share was smaller than her margin, or that the Times’ main source later tried to recant.</li>
    <li><a href="https://apnews.com/article/alaska-senate-peltola-sullivan-congress-f1fd4d243bf764ec46ff94db4c792953">AP</a>: Reports the win as the last Senate race decided and quotes Peltola’s statement on high costs. It says Sullivan’s campaign did not respond and had said it would let the count “run its course.” It gives the fullest account of the second-Sullivan dispute: the Times report, which drew on a fired former campaign manager who “later sought to recant”; Peltola’s and the second Sullivan’s denials; Trump’s call for prosecution; the Justice Department suit, dismissed and on appeal; and the criminal investigation. It quotes voters on both sides and her “not liberal or radical” pitch.</li>
    <li><a href="https://www.foxnews.com/politics/alaska-dem-peltola-defeats-sullivan-flipping-gop-senate-seat-decoy-dan-uproar">Fox</a>: Its headline leads with the “‘decoy Dan’ uproar,” and its subhead calls the result “razor-thin.” It quotes Peltola’s victory video, gives her 50.1%, and details the Times report (“ballot composition project,” Senate campaign committee involvement), the campaign’s and committee’s denials and Gov. Dunleavy’s investigation. It says the Justice Department sued “to mitigate any ‘misleading’ impact” but not that the suit was dismissed. It explains ranked-choice voting. Inside the story it links to earlier pieces headlined “far-left meddling” and “Court keeps ‘Decoy Dan’ on Alaska ballot.”</li>
    <li><a href="https://nypost.com/2026/11/17/us-news/mary-peltola-finally-declared-winner-of-alaska-senate-race-2-weeks-after-midterms/">New York Post</a>: Its headline says Peltola was “finally declared” the winner two weeks after Election Day. It gives the vote, calls the second Sullivan “Decoy Dan” throughout, and after attributing the Times report says in its own voice that Democrats “successfully recruited” him. It quotes the former campaign manager saying Peltola was “definitely aware,” without noting that she later tried to recant, and reports that the Justice Department sought to withhold certification without saying the suit was dismissed. It quotes Peltola’s denial and adds a September report on her alleged outbursts and slurs at staff, without the campaign’s response. It notes she is the first Indigenous Alaskan in the Senate.</li>
    <li><a href="https://www.washingtonexaminer.com/news/campaigns/congressional/4756043/mary-peltola-dan-sullivan-alaska-senate-race-results/">Washington Examiner</a>: Reports the call, the vote with 99% counted, why Alaska counts for two weeks, and that Peltola had declared victory days earlier. It quotes Sullivan’s Monday statement that he would wait for the call, recounts forecasters’ shifts and polling, and credits her “strength with independent and crossover voters.” It does not mention the second Sullivan, the Times report, the investigations or the Justice Department lawsuit at all. It misstates her primary result.</li>
    <li><a href="https://www.cbsnews.com/news/alaska-2026-senate-sullivan-peltola/">CBS News</a>: Reports the projection, the 56-44 majority and Peltola’s full statement, and notes she will be the first Alaska Native elected to the Senate. In its own voice it says she “successfully portrayed herself as an independent voice” and that “the unpopular war in Iran” and high fuel prices hung over Republicans. It covers the second Sullivan’s candidacy and the Justice Department suit, and adds that her margin was large enough that his votes “wouldn’t have made a difference.” It does not mention the Times recruitment report, Peltola’s denial or the state and federal investigations.</li>
    <li><a href="https://www.cnn.com/2026/11/17/politics/mary-peltola-wins-alaska-senate">CNN</a>: Reports the win and that Schumer recruited Peltola, quotes both, and notes she will be the first Native American senator from Alaska. It says the race was “upended” by the second Sullivan, reports the Times’ account that operatives working for Peltola recruited him, her campaign’s denial, Dunleavy’s investigation and Trump’s call for prosecution. In its own voice it calls the Justice Department suit “the remarkable step,” and reports that it was dismissed and appealed. It covers both campaigns’ pitches and the September report on staff mistreatment, with the campaign’s response.</li>
    <li><a href="https://www.ms.now/news/peltola-sullivan-alaska-senate-election-results">MSNOW</a>: Reports the call, the 56-seat majority and Peltola’s video statement, and notes she will be the first Alaska Native in the Senate. Drawing on its own voter poll, it says in its own voice that “Trump turned out to be a drag on Sullivan,” that she “ran as a centrist” and that her message “worked.” It covers the second-Sullivan dispute: the Times report, her denial, the state and federal investigations (including FBI visits to his donors), the lawsuit’s dismissal and appeal, and poll figures showing few Trump voters backed him. It notes Sullivan had said he would accept the result.</li>
  </ul>

 w.append(E('div','vf','<div><span class="tag">'+esc(K.weights[f.weight]||f.weight)+'</span><span class="tag">'+esc(K.categories[f.category]||f.category)+'</span>'+((()=>{const O=CONTRACT.lean_rubric.omission,v=f[O.fact_field];return O&&(v==='R'||v==='D')?'<span class="tag">'+esc(O.grid_tag.replace('{side}',O.values[v]))+'</span>':''})())+'</div><div><b>'+esc(f.text)+'</b></div><div class="sm">Source: '+esc(f.source||'')+'</div><div>'+Object.keys(names).sort((a,b)=>(RANKS.cred[a]??99)-(RANKS.cred[b]??99)).map(k=>{const st=row[k]||'not_checked';return '<span class="v" style="background:'+(CVC[st]||'#6b7280')+';margin-right:6px">'+esc(names[k])+': '+esc(K.statuses[st]||st)+'</span>'}).join('')+(cv._nc||[]).map(o=>'<span class="v" style="background:#9aa1ad;margin-right:6px">'+esc(o.outlet)+': '+esc(ncK(o).grid_label)+'</span>').join('')+'</div>'))});
 w.append(E('p','note','Leaving out a central or important fact lowers an outlet’s Strategic Silence rating. “Reported later” means the fact came out after that article was published, so it is not counted against it.'));return w}
function ncOC(el,NC,isNotes){if(!NC.length)return el;const K=CONTRACT.not_covered,ul=el.querySelector('ul')||el;NC.forEach(o=>ul.append(E('li','',isNotes?(ncK(o).notes_line?esc(o.outlet)+': '+esc(ncK(o).notes_line):esc(o.outlet)+': Not placed on the map. It ran no written article on this story ('+esc(o.window||'')+')'+(ncK(o).silence_word?', which the metrics record as '+esc(ncK(o).silence_word)+' Strategic Silence.':'.')):'<b>'+esc(o.outlet)+'</b>: '+esc(ncK(o).status_label)+' ('+esc(o.window||'')+'). Searched: '+esc(o.searched||'')+'.')));return el}
function ncCred(w,NC){if(!NC.length)return w;const K=CONTRACT.not_covered;NC.forEach(o=>w.append(E('div','row','<span>'+esc(o.outlet)+'</span><div class="trk" role="img" aria-label="'+esc(ncK(o).row_label)+'" style="display:flex;align-items:center;padding-left:8px;font:12px Arial,sans-serif;color:var(--mut)">'+esc(ncK(o).row_label)+'</div><b>—</b>')));const pw=NC.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=NC.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<NC.length?'No score for an outlet with no article: there is nothing to check for accuracy or framing. It gets no ratings; its status shows what was found. ':'')+(pw?K.paywalled.cred_note+' ':'')+(wo?W.cred_note:'')));return w}
function ncHeat(w,NC){if(!NC.length)return w;const K=CONTRACT.not_covered,tb=w.querySelector('tbody'),panel=w.querySelector('.panel');NC.forEach(o=>{const tr=E('tr','','<td>'+esc(o.outlet)+'</td>');['spin','silence','distortion','factual'].forEach(m=>{const td=E('td');if(m==='silence'&&ncK(o).silence_word){const wd=ncK(o).silence_word,l=lvl('silence',wd),b=E('button','cell',esc(wd));b.style.background=hue(l);b.style.color=hueTxt(l);b.style.fontWeight='700';b.setAttribute('aria-pressed','false');b.onclick=()=>{w.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');panel.style.display='block';panel.innerHTML='<b>'+esc(o.outlet)+' — Strategic Silence: '+esc(wd)+'</b><ul><li>'+esc(ncK(o).silence_reason)+'</li><li>Searched: '+esc(o.searched||'')+'; '+esc(o.window||'')+'.</li></ul>'};td.append(b)}else{const d=E('div','cell','—');d.style.background='var(--trk)';d.style.cursor='default';d.style.boxSizing='border-box';d.title=ncK(o).row_label;td.append(d)}tr.append(td)});tb.append(tr)});return w}
function ncFrame(w,NC){NC.forEach(o=>w.append(E('div','vf','<span class="chip" style="background:'+col(o.class)+'">'+esc(o.outlet)+'</span> <span class="v" style="background:#6b7280">'+esc(ncK(o).row_label)+'</span><div class="sm">'+esc(ncK(o).frame_line||'No article, so there were no images to review.')+'</div>')));return w}
function methodCard(){const M=CONTRACT.methodology,W=CONTRACT.credibility,c=card('How this analysis works',E('div')),b=c.lastChild;
 b.append(E('p','',esc(M.intro)));
 const mt=E('div');Object.entries(CONTRACT.metrics).forEach(([k,v])=>{let h='<p><b>'+esc(v.label)+'</b></p><table><tbody>'+v.words.map((w,i)=>'<tr><td style="width:24%"><span class="v" style="background:'+hue(i)+';color:'+hueTxt(i)+'">'+esc(w)+'</span></td><td style="text-align:left">'+esc((M.metric_definitions[k]||{})[w]||'')+'</td></tr>').join('')+'</tbody></table>';mt.append(E('div','',h))});
 mt.append(E('p','note','Green is better and red is worse on every scale.'));Object.entries(CONTRACT.metrics).forEach(([k,v])=>{});b.append(det('What each rating word means',mt));
 const cw=W.weights,lab=W.weight_labels;let h='<p>Each outlet’s score out of 100 is calculated from its ratings, not judged separately. Better ratings earn more points, and each kind of rating counts for a set share of the total:</p><ul>'+Object.keys(cw).map(k=>'<li>'+esc(lab[k])+': '+cw[k]+'%</li>').join('')+'</ul><p>Images count fully when we saw them and half when we could only read the caption. Score bands: '+W.bands.map(x=>esc(x[0].replace(/^Below/,'below'))+' '+esc(x[1]).toLowerCase()).join('; ')+'.</p>';
 b.append(det('How the credibility score works',E('div','',h)));
 b.append(det('Fact-check verdicts',E('div','','<ul>'+Object.entries(M.verdict_definitions).map(([k,v])=>'<li><b>'+esc(k)+'</b>: '+esc(v)+'</li>').join('')+'</ul>')));
 b.append(det('What each outlet included',E('div','','<p>For each key fact, the grid shows whether an outlet included it, mentioned it briefly, left it out, or reported it later because the fact came out after its article. Leaving out a central or important fact lowers the Strategic Silence rating.</p><p>'+esc(M.not_covered)+'</p>')));
 b.append(det('The Bias Map',E('div','','<p>'+esc(M.bias_map)+'</p>')));
 b.append(det('Headlines and lead images',E('div','','<p>'+esc(M.imagery)+'</p><p>The image at the top of each analysis is public domain or openly licensed, or made for the analysis, and credited in its caption.</p>')));
 if(M.lean)b.append(det('How we measure tilt',E('div','','<p>'+esc(M.lean)+'</p>')));b.append(det('Sister sites, TV and video',E('div','','<p>'+esc(M.network)+'</p>')));if(M.placement)b.append(det('Homepage placement and labels',E('div','','<p>'+esc(M.placement)+'</p>')));b.append(det('When outlets run AP or Reuters articles',E('div','','<p>'+esc(M.wire_copy)+'</p>')));b.append(det('Checking our own bias',E('div','','<p>'+esc(M.mirror_test)+'</p>'+(M.blind_pass?'<p>'+esc(M.blind_pass)+'</p>':'')+'<p>We also compare each score with the outlet’s usual track record. When a score is unusually high or low, we recheck it, but this story’s articles decide.</p>')));
 if(/^https:\/\//.test(M.url||''))b.append(E('p','','<a href="'+esc(M.url)+'" target="_blank" rel="noopener noreferrer">'+esc(M.url_label)+'</a>'));
 return c}
function ncList(L){const K=CONTRACT.not_covered,w=E('div');L.forEach(o=>w.append(E('div','vf','<b>'+esc(o.outlet)+'</b> <span class="v" style="background:#6b7280">'+esc(ncK(o).status_label)+'</span><div class="sm">Searched: '+esc(o.searched||'')+'</div><div class="sm">Window: '+esc(o.window||'')+'</div>'+(o.sister_sites?'<div class="sm">'+esc(o.sister_sites)+'</div>':'')+(o.context?'<div>'+esc(o.context)+[].concat(o.context_source||[]).filter(u=>/^https:\/\//.test(u)).map((u,i,A)=>' <a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Source'+(A.length>1?' '+(i+1):'')+'</a>').join('')+'</div>':''))));const pw=L.filter(o=>o[K.paywalled.field]).length,W=K.wire_only||{},wo=L.filter(o=>W.field&&o[W.field]).length;w.append(E('p','note',(pw+wo<L.length?K.note+' ':'')+(pw?K.paywalled.note+' ':'')+(wo?W.note:'')));return w}
function drift(D){const P=[];if(D.add_baseline)P.push({quote:D.baseline_quote,degree:0});(D.points||[]).forEach(p=>P.push(p));
 const W=560,H=290,cx=W/2,cy=245,R=200,rd=d=>Math.PI/180*(180-d),xy=(r,d)=>[cx+r*Math.cos(rd(d)),cy-r*Math.sin(rd(d))],arc=(r,a,b)=>{const p=xy(r,a),q=xy(r,b);return'M'+p+'A'+r+' '+r+' 0 0 1 '+q};
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drift gauge"><defs><linearGradient id="gg"><stop offset="0" stop-color="#15803d"/><stop offset=".5" stop-color="#fde047"/><stop offset="1" stop-color="#e24a3b"/></linearGradient></defs><path d="'+arc(R,3,177)+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/>';
 for(let d=0;d<=180;d+=30){const a=xy(R-14,d),b=xy(R-24,d),t=xy(R-40,d);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#8892a2" stroke-width="2"/><text x="'+t[0]+'" y="'+(t[1]+4)+'" text-anchor="middle">'+d+'°</text>'}
 const last=P[P.length-1].degree,n=xy(R-70,last);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--fg)"/>';
 P.forEach((p,i)=>{const near=P.slice(0,i).filter(q=>Math.abs(q.degree-p.degree)<14).length,m=xy(R+near*30,p.degree);s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" fill="#fff" stroke="#2b5ea7" stroke-width="2.5"/><text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" style="fill:#2b5ea7;font-weight:700">'+(i+1)+'</text>'});
 const HY=CONTRACT.hypocrisy,sev=Object.keys(HY.severity_to_degrees).find(k=>last>=HY.severity_to_degrees[k][0]&&last<=HY.severity_to_degrees[k][1])||'1',band='Severity '+sev+': '+HY.severity_names[sev];
 s+='<text x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">'+last+'° — '+band+'</text></svg>';
 const w=E('div','',s);P.forEach((p,i)=>w.append(E('div','dq','<div class="dn">'+(i+1)+'</div><div><b>'+(i?(i===P.length-1?'Current — ':'Earlier — ')+p.degree+'°':'Baseline — 0°')+'</b><div>'+esc(p.quote||'')+'</div></div>')));return w}
function render(src){const{b,rest}=parse(src),out=$('#out');out.innerHTML='';
 if(!Object.keys(b).length){out.append(card('Nothing to render',E('p','','No blocks found. Wrap each section in <!-- BEGIN: id --> … <!-- END: id --> comments.')));return}
 const D=runData(b);setRank(D);const el=id=>b[id]?clean(dom(b[id]).firstElementChild||dom(b[id])):null,tx=id=>el(id)?el(id).textContent.trim():'';

 const NC=(D.notCovered&&D.notCovered.outlets)||[];if(D.cred)out.append(E('div','chips',byRank(D.cred.scores).map(o=>'<span class="chip" style="background:'+col(o.class)+'"'+(wireTxt(o)?' title="'+esc(wireTxt(o))+'"':'')+'>'+esc(o.outlet)+(wireTxt(o)?' <small class="cw">· '+esc(o[CONTRACT.wire_copy.fields.source])+' text</small>':'')+(viaTxt(o)?' <small class="cw">· '+esc(viaTxt(o))+'</small>':'')+(typeTxt(o)?' <small class="cw">· '+esc(typeTxt(o))+'</small>':'')+'</span>').join('')+NC.map(o=>'<span class="chip nc" title="'+esc(ncK(o).status_label)+'">'+esc(o.outlet)+': '+esc(ncK(o).chip_suffix)+'</span>').join('')));
 if(el('hero')){const f=el('hero'),im=f.querySelector('img'),cp=f.querySelector('figcaption'),u=im&&im.getAttribute('src')||'';if(/^https?:/.test(u)||/^data:image\/(jpeg|png|webp);base64,/.test(u)){const fg=E('figure'),i2=E('img');i2.alt=im.alt||'';i2.src=u;i2.onerror=()=>i2.replaceWith(E('p','note','Hero image could not be loaded here (remote images may be blocked). Source: '+esc(u)));fg.append(i2);if(cp)fg.append(E('figcaption','',esc(cp.textContent)));out.append(fg)}}
 if(el('nr-body')){const bc=card(ST['nr-body'],el('nr-body')),DL=CONTRACT.dropdown_labels;if(el('historical-context'))bc.append(det(DL['historical-context'],el('historical-context')));if(el('outlet-coverage')){const oc=el('outlet-coverage');((D.cred&&D.cred.scores)||[]).filter(o=>wireTxt(o)||viaTxt(o)||typeTxt(o)||placeOf(D,o)).forEach(o=>oc.querySelectorAll('li').forEach(li=>{const a=li.querySelector('a');if(a&&a.textContent.trim()===o.outlet)li.insertAdjacentHTML('beforeend',[wireTxt(o),viaTxt(o),typeTxt(o),placeOf(D,o)].filter(Boolean).map(t=>' <span class="tag wt2">'+esc(t)+'</span>').join(''))}));liRank(oc);if(D.placement&&D.placement.checked_at)oc.append(E('p','note','Homepages checked '+esc(D.placement.checked_at)+'. '+esc(CONTRACT.placement.note)));bc.append(det(DL['outlet-coverage'],ncOC(oc,NC)))}if(D.network&&D.network.outlets)bc.append(det(DL['network-coverage'],netList(D.network)));if(D.coverage&&D.coverage.facts){const nm={};((D.cm&&D.cm.rows)||[]).forEach(r=>nm[r.class]=r.outlet);D.coverage._nc=NC;bc.append(det(DL['coverage-grid'],covGrid(D.coverage,nm)))}out.append(bc)}else if(el('outlet-coverage'))out.append(card('Outlet Coverage',el('outlet-coverage')));
 if(NC.length)out.append(card(ncTitle(NC),ncList(NC)));
 if(el('fc-claims')||el('fc-conspiracy')){const c=card('Fact Check',el('fc-claims')?fcList(el('fc-claims')):E('div'));if(el('fc-conspiracy'))c.append(det('Conspiracy Chatter',fcList(el('fc-conspiracy'))));out.append(c)}
 if(D.cred)out.append(card('Credibility Score',ncCred(credBars(D.cred.scores),NC)));
 if(D.cm)out.append(card(ST['comparative-metrics'],ncHeat(heat(D.cm),NC)));
 if(el('hypocrisy')){const sv=(tx('hypocrisy').match(/Severity\s*(\d)/)||[])[1];out.append(card('🤔 Hypocrisy Call-Out'+(sv?' — Severity '+sv+' of 5':''),el('hypocrisy')))}
 const dj=Object.keys(b).filter(k=>/drift/.test(k)).map(k=>/<script[^>]*json[^>]*>([\s\S]*?)<\/script>/.exec(b[k])).find(Boolean);
 if(dj){try{const J=JSON.parse(dj[1]);out.append(card('Narrative Drift — '+(J.focus_actor||''),drift(J)))}catch(e){out.append(card('Narrative Drift',E('p','','The drift JSON could not be read: '+esc(e.message))))}}
 if(D.bias){const bm=card('Bias Map',biasMap(D.bias)),bb=bm.lastChild;if(D.lean&&D.lean.outlets){if(D.lean.summary)bb.prepend(E('p','',esc(D.lean.summary)));bb.append(det('Signs of tilt, outlet by outlet',leanBlock(D.lean,D)))}if(NC.length)bb.append(E('p','note','Not placed on the map: '+NC.map(o=>esc(o.outlet)+' ('+esc(ncK(o).chip_suffix)+')').join(', ')+'.'));out.append(bm)}
 if(el('bias-notes')){const bnE=el('bias-notes');liRank(bnE,'tilt');const bn=card(ST['bias-notes'],ncOC(bnE,NC,1));if(D.lean&&D.lean.outlets){const st=signsTable(D.lean,D),bt=blindTxt(D.lean);if(bt)st.append(E('p','note',esc(bt)));bn.lastChild.prepend(st)}out.append(bn)}if(D.mirror&&D.mirror.outlets)out.append(card(CONTRACT.lean_rubric.mirror.label,mirrorCard(D.mirror)));
 if(D.imagery&&D.imagery.records)out.append(card(ST['imagery'],ncFrame(framing(D.imagery.records),NC)));else if(el('imagery')){const c=card(ST['imagery'],E('div'));c.lastChild.append(det('Images by outlet',el('imagery')));out.append(c)}
 const n=/<p>[\s\S]*?<\/p>/.exec(rest);if(n)out.append(E('p','note',clean(dom(n[0])).textContent));out.append(methodCard())}
